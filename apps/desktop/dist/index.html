<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Liberty</title>
    <!--
      THE ONLY PAGE THE SHELL SERVES ITSELF, and in the ordinary case nobody
      sees it: the window is created hidden and is navigated to the sidecar's
      origin before it is shown.

      It exists for the failure case. A shell whose sidecar will not start has
      to say so somewhere, and "somewhere" cannot be the sidecar. This is that
      somewhere, and it is deliberately one file with no build step, no
      dependency and no network: a failure screen that needed any of those
      could fail for the same reasons it is reporting.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #06080d;
        --surface: #10141d;
        --text: #f7f9fc;
        --muted: #9aa5b5;
        --danger: #ff9b9b;
        --border: rgba(255, 255, 255, 0.09);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      main { max-width: 560px; }
      .brand { font-weight: 800; letter-spacing: -0.04em; font-size: 14px; color: var(--muted); }
      h1 { font-size: 1.5rem; margin: 12px 0 16px; }
      p { color: var(--muted); margin: 0 0 16px; }
      .card {
        border: 1px solid var(--border);
        border-left: 3px solid var(--danger);
        border-radius: 12px;
        background: var(--surface);
        padding: 20px 24px;
      }
      .retry { font-size: 0.875rem; color: var(--muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">PROJECT LIBERTY</div>
      <div id="starting">
        <h1>Starting…</h1>
        <p>Preparing the local service.</p>
      </div>
      <div id="failure" class="card" role="alert" hidden>
        <h1 id="headline"></h1>
        <p id="detail"></p>
        <p class="retry" id="retry" hidden>Starting the application again may help.</p>
      </div>
    </main>
    <script type="module">
      /*
       * `event.listen` is Tauri's own channel and needs no bundler: the shell
       * injects its API before this page runs. The text is set with
       * `textContent`, never `innerHTML` -- a failure detail can quote a path or
       * an error string this process did not author, and a failure screen is a
       * poor place to introduce the one injection point in the application.
       */
      const show = ({ headline, detail, retryMayHelp }) => {
        document.getElementById("starting").hidden = true;
        document.getElementById("headline").textContent = headline ?? "Project Liberty could not start";
        document.getElementById("detail").textContent = detail ?? "";
        document.getElementById("retry").hidden = !retryMayHelp;
        document.getElementById("failure").hidden = false;
      };
      /*
       * TWO WAYS IN, AND THE SECOND IS THE ONE THAT WAS MISSING.
       *
       * `await listen(...)` resolves asynchronously. A sidecar that dies in
       * milliseconds reaches the shell's surface_failure BEFORE it does, and
       * Tauri does not replay events -- so the report was emitted into nothing
       * and this page sat on "Preparing the local service" forever. The
       * supervision machinery had worked; only delivery failed.
       *
       * The shell now also writes the report straight onto this page with
       * `eval`, which needs no subscriber. It sets `__libertyStartupFailure`
       * and calls `__libertyShowStartupFailure` if that exists yet. So:
       * publish the renderer FIRST, then read anything that arrived before we
       * were ready, and only then subscribe for anything still to come.
       */
      window.__libertyShowStartupFailure = show;
      if (window.__libertyStartupFailure) {
        show(window.__libertyStartupFailure);
      }
      try {
        const { listen } = await import("@tauri-apps/api/event");
        await listen("liberty://startup-failure", (event) => show(event.payload ?? {}));
        /* Once more, in case it landed between the read above and the
         * subscription completing. `show` is idempotent -- it only sets text
         * and toggles hidden -- so running it twice is harmless and running it
         * zero times is the bug this replaces. */
        if (window.__libertyStartupFailure) {
          show(window.__libertyStartupFailure);
        }
      } catch {
        /* No Tauri API: this page was opened outside the shell. The eval path
         * above still works, because it does not depend on the API. */
      }
    </script>
  </body>
</html>
