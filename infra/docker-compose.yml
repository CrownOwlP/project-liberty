services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: liberty
      POSTGRES_PASSWORD: liberty
      POSTGRES_DB: liberty
    ports:
      - "5432:5432"
    volumes:
      - liberty_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liberty -d liberty"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - liberty_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liberty_postgres:
  liberty_redis:
