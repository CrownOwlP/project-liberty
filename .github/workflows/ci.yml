name: CI

# ============================================================================
# WHEN THIS RUNS, AND WHY IT IS NO LONGER JUST `main`
# ============================================================================
#
# The trigger used to be `pull_request` plus `push: branches: [main]`. All
# development happens on a long-lived working branch, `main` is deliberately
# untouched, and no pull request is open. So the trigger set matched nothing
# anybody actually did: the working branch carried zero workflow runs and zero
# commit statuses, and every green result this month came from one Windows
# laptop. Nothing had ever been verified on a clean Linux checkout installed
# from the lockfile.
#
# A gate that never fires is indistinguishable, from the outside, from a gate
# that passes. This repository has already been bitten twice by that exact
# shape: an environment validator that confidently passed while reading files
# the application never read, and CI failing unnoticed for rounds because the
# only gates anyone watched ran locally. Absence of signal reads as success, and
# nothing in the tooling contradicts it.
#
# So the push filter is now a DENY list rather than an allow list, and the
# direction is the whole argument. Under an allow list, a branch whose name
# nobody anticipated silently gets no CI, and the symptom is absence -- the one
# symptom nobody notices. Under a deny list, a new branch is covered by default
# and opting out is a deliberate act with a name attached to it.
#
# Rejected:
#
#   - `branches: [main, 'codex/**', 'agent/**']`. Correct today and silently
#     wrong the first time a branch is called something else. It re-creates the
#     failure this change exists to remove, one rename later.
#
#   - Every branch, no exclusions. `dependabot/**` pushes are always accompanied
#     by a pull request, which `pull_request` below already covers, so a push
#     trigger there doubles the cost of every dependency bump and buys nothing.
#
#   - `paths-ignore` for docs-only pushes. It does not make the run cheap, it
#     makes the run NOT EXIST -- the commit ends with no status at all, which is
#     the failure mode above wearing a cost-saving hat. Cost is handled by
#     `concurrency` below instead, which is a mechanism that still leaves the
#     head commit with a real verdict.
#
# Cost, concretely. `cancel-in-progress` collapses a burst of pushes on one
# branch into a single surviving run, so the bill scales with distinct branches
# pushed per night rather than with pushes per night. State the consequence here
# rather than leaving it to be discovered: superseded commits are left
# CANCELLED, which is neither a pass nor a failure. Read a cancelled run as "no
# verdict for that commit". The head commit is the one that gets a verdict.
#
# Bot pushes do not multiply this. GitHub does not fire push-triggered workflows
# for commits made with the default GITHUB_TOKEN, so the agent workers'
# scheduled control-plane pushes to `main` cost nothing here -- which is also
# why `workflow_dispatch` exists below and why
# `.github/workflows/agent-claude-worker.yml` calls it explicitly.
#
# One bootstrap fact worth knowing before wondering why nothing happened: a push
# trigger is evaluated against the workflow file as of the pushed commit. This
# widening therefore takes effect on the first push that CONTAINS it, and not on
# the push before that.
#
# Secrets: this workflow references none, and holds `contents: read`. Widening a
# trigger is a secret-exposure question whenever a job can read one, so it was
# checked rather than assumed. `pull_request` (not `pull_request_target`) runs a
# fork PR with a read-only token and no access to repository secrets, and the
# push trigger only fires for someone who can already push to this repository.
# The two workflows that DO hold secrets -- `agent-claude-worker.yml`
# (ANTHROPIC_API_KEY) and `agent-gpt-review.yml` (OPENAI_API_KEY) -- are
# `workflow_dispatch` and `schedule` only and are untouched by this change.

on:
  pull_request:
  push:
    branches-ignore:
      # Dependabot always opens a PR; `pull_request` already covers those commits.
      - "dependabot/**"
      # Explicit opt-out namespaces for throwaway spikes nobody will read a
      # verdict from. Push under any other name and you get CI.
      - "wip/**"
      - "scratch/**"
      - "experiment/**"
  # Required for the autonomous loop: GitHub does not fire push-triggered
  # workflows for commits made with the default GITHUB_TOKEN, so a cloud
  # worker's push would otherwise never be verified by CI. The workers
  # dispatch this explicitly after pushing.
  #
  # WHAT THAT DISPATCH ACTUALLY VERIFIES TODAY, stated because the sentence above
  # is easy to read as more than it is. `agent-claude-worker.yml` runs
  # `gh workflow run ci.yml --ref main`, and it also checks out `ref: main` and
  # pushes there -- so a dispatched run tests `main`'s tree, not the working
  # branch this repository actually develops on. Both statements in this file's
  # header cannot be operationally true at once, and
  # docs/GITHUB_SETUP.md, "The branch problem, which will bite before anything
  # else does", is where the decision belongs: fast-forward `main` to the working
  # branch, or point the workers at the working branch. Either way the fix is in
  # the agent workflows, not here -- this trigger is correct for both -- and it
  # is recorded here so nobody reads the push-trigger widening below as having
  # already covered it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the ref, which means a push run and a pull_request run for the same
  # branch land in DIFFERENT groups -- `refs/heads/<branch>` against
  # `refs/pull/<n>/merge` -- and both survive. That is deliberate rather than an
  # oversight in the widened trigger, because the two do not test the same tree:
  # the push run tests the branch tip, the PR run tests the tip merged into the
  # base, and `main` moves underneath the working branch every time an agent
  # worker publishes control state. Those can genuinely disagree.
  #
  # Rejected: normalising the two onto one key with
  # `${{ github.event.pull_request.head.ref || github.ref_name }}`. It does
  # remove the duplicate, but it removes it by CANCELLING one of them, and which
  # one dies is a race between two near-simultaneous events. Trading the
  # merge-result verdict for a runner-minute is trading signal for change, and a
  # required check that ends up cancelled is a pull request that can never go
  # green.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # The gate. Mirrors the local round step for step; see the drift note below.
  # ==========================================================================
  #
  # The job name is `validate` and stays `validate`. If branch protection has a
  # required status check configured, it names this job, and renaming it would
  # turn a required check into a check that never reports -- silently, and in
  # the direction this file exists to prevent. Adding a job is safe; renaming
  # one is not.
  validate:
    runs-on: ubuntu-latest
    # Pinned rather than left to the documented default. turbo.json lists this in
    # globalEnv, so while it is unset it hashes as ABSENT into a build cache that
    # is shared between runs, and one entry can then serve builds that meant
    # different enforcement modes. `validate-env.mjs --scope ci` fails on an unset
    # cache-key variable for that reason; setting it here is the fix it asks for,
    # not a way around it.
    # Every @cache-key variable must be set here, not just this one. The rule is
    # mechanical: `@cache-key` means turbo.json hashes it into a cache key shared
    # between runs, which is exactly why `--scope ci` refuses to let it be unset.
    # So adding a variable to globalEnv is three edits in the repo and a fourth
    # here, and forgetting the fourth turns CI red on a run that has nothing to do
    # with the change. LIBERTY_FC_SEED was added without it and CI has been failing
    # here since, unnoticed, because every gate we actually watch runs locally.
    #
    # Re-checked against `.env.example` and `turbo.json` as of this edit. The
    # `@cache-key` set is exactly these three. `NODE_ENV` is the fourth name in
    # `globalEnv` and is deliberately NOT here: it is `@optional` rather than
    # `@cache-key` because that annotation is about what an UNSET variable
    # hashes as, and NODE_ENV is set by whatever is running the build. Pinning it
    # here would be worse than useless -- it would decide, from a workflow file,
    # which branches of `authorized-candidates.ts` and the resolve handler the
    # built artifact takes.
    #
    # These are exported into the job environment, which is the only spelling
    # that works. `apps/web`'s `dev` and `start` now load the repository root's
    # dotenv files through `scripts/with-root-env.mjs`, and `build` deliberately
    # does not -- because that loader sets variables INSIDE the task, while turbo
    # hashes `globalEnv` from the environment it sees BEFORE launching it. CI
    # must not, and does not, depend on that wrapper: nothing here runs `dev` or
    # `start`, and `npm run build` gets these values from the job `env:` above
    # turbo, where they are hashed correctly. See docs/DEVELOPMENT.md,
    # "Why `build` is not wrapped".
    env:
      CONTENT_RIGHTS_ENFORCEMENT: strict
      LIBERTY_FC_SEED: "20250819"
      LIBERTY_FIXTURE_MEDIA_ORIGIN: https://fixtures.invalid
      # DIAGNOSTIC ONLY, AND IT CHANGES NOTHING ABOUT WHAT THIS JOB IS GIVEN
      # (PL-0714). On 30cef6e this job aborted at 10m 38s with a single
      # annotation -- "Process completed with exit code 134", naming no step --
      # after passing at 25m 4s and 27m 29s on the two runs before it. 134 is
      # SIGABRT, which is how Node leaves when V8 calls a fatal error rather
      # than when a check fails. The engineering session cannot read this job's
      # log or download its artifacts, so that annotation was the entire
      # evidence available and it was not enough to name a step, let alone a
      # cause.
      #
      # `--report-on-fatalerror` makes Node write a diagnostic report beside
      # the process when V8 aborts: the triggering event in words, the heap
      # limit and what was committed against it, peak RSS, and the native
      # stack. It costs nothing on a run that does not abort -- no sampling, no
      # instrumentation, nothing written -- and the final step of this job
      # renders a REDACTED extract of any report it finds to the job summary,
      # which is readable on a public run page.
      #
      # WHAT IT IS NOT. Not a remedy, and deliberately not accompanied by one.
      # No `--max-old-space-size`, no raised timeout, no retry, no skipped
      # suite. A cause has not been established and nothing here asserts one;
      # OOM is one hypothesis among several and the local reproductions did not
      # support it (1261 s ambient and 1807 s under a 4 GB cap, both exit 0).
      # This exists so the NEXT occurrence produces evidence instead of a
      # number.
      #
      # Not in turbo.json's globalEnv, so it does not enter any cache key.
      NODE_OPTIONS: --report-on-fatalerror
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version; keeps CI and local
          # development from drifting apart.
          node-version-file: .nvmrc
          cache: npm
          # Stated explicitly rather than left to setup-node's search. There are
          # now two lockfiles in this repository -- the root one and `e2e/`'s,
          # which is outside the npm workspaces on purpose (docs/E2E.md) -- and
          # two jobs that cache different trees. An implicitly-derived key that
          # happened to pick up the wrong lockfile would restore a node_modules
          # that does not match the install about to run, and `npm ci` would
          # paper over it.
          cache-dependency-path: package-lock.json

      # ====================================================================
      # THE MACHINE THIS RAN ON (PL-0714)
      # ====================================================================
      #
      # Written to the job summary, which renders on a public run page, because
      # the log and the artifacts of this job need authentication and the
      # engineering session that maintains it has neither. When this job
      # aborted with exit 134 the four facts that would have narrowed it --
      # core count, memory, free disk and NODE_OPTIONS -- were all unavailable,
      # and the last of those turned out to matter: every local reproduction of
      # the prime suspect had been taken in a container that sets
      # `NODE_OPTIONS=--max-old-space-size=8192`, which a runner does not. The
      # measurements were being compared against a heap CI never had, and
      # nobody noticed for two rounds.
      #
      # AN ALLOWLIST, NEVER A DUMP. `env` is not printed and must not be: this
      # summary is public on a public run page. Every value below is either a
      # fact about the hardware or a variable this workflow itself sets in
      # plain text a few lines above.
      - name: Record the machine this job ran on
        id: runner-facts
        run: |
          {
            echo "## validate — the machine"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| runner | \`${RUNNER_OS}\` \`${RUNNER_ARCH}\` |"
            echo "| cores | $(nproc) |"
            echo "| memory | $(free -h --si | awk '/^Mem:/ {print $2 " total, " $7 " available"}') |"
            echo "| disk (workspace) | $(df -h --output=size,avail "${GITHUB_WORKSPACE}" | tail -1 | awk '{print $2 " available of " $1}') |"
            echo "| node | $(node --version) |"
            echo "| npm | $(npm --version) |"
            echo "| NODE_OPTIONS | \`${NODE_OPTIONS:-<unset>}\` |"
            echo "| ulimit -v | $(ulimit -v) |"
            echo "| ulimit -c | $(ulimit -c) |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      # These run before install: they depend only on Node builtins (and git),
      # so
      # a dependency problem cannot mask a control-plane, structure, env-validator
      # or dispatcher failure. That ordering is load-bearing for the structure
      # step in particular, which now also checks that every workspace declares
      # the packages it imports -- a check on the correctness of dependency
      # DECLARATIONS must not need a successful dependency INSTALL in order to run.
      #
      # The suites below plus the two validators are a COMPLETE mirror of
      # `npm run test:scripts`, split into named steps rather than invoked through
      # the npm alias. That split is on purpose: separate steps give independently
      # readable red/green marks instead of one.
      #
      # IT IS ALSO A DRIFT SURFACE, AND THIS COMMENT USED TO BE THE ONLY THING
      # HOLDING IT TOGETHER. It said, in bold, that a script added to the alias
      # must be added here too -- and then, in the paragraph after, recorded that
      # the drift had ALREADY happened once before PL-AI-0002 read it:
      # `scripts/test-validate-repo.mjs`, the suite behind the agent-instruction
      # control, ran on somebody's laptop and nowhere else.
      #
      # IT THEN HAPPENED TWICE MORE. By the time PL-0714 looked, the alias named
      # six scripts and this job ran four: `scripts/test-desktop-target.mjs` and
      # `node --test scripts/windows/test-lifecycle.mjs` (30 cases) were in the
      # alias and had no step. Both are below now. The lesson is not that the
      # comment should have been louder. The note that a hand-kept list must be
      # kept in step did not keep it in step on any of the three occasions; it
      # only made each gap legible once somebody went looking.
      #
      # SO THE LIST IS NOW CHECKED BY A MACHINE. The `mirror-check` step below
      # derives the alias's scripts from `package.json`, derives this job's from
      # this file, and fails with the missing names when they disagree. Adding a
      # script to the alias and forgetting the step is a red build, not a suite
      # that runs nowhere. Add your step wherever it belongs; the check is what
      # remembers, not you.
      - name: Validate AI control plane
        id: ai-validate
        run: node scripts/ai-control-plane.mjs validate
      - name: Test AI control plane
        id: ai-suite
        run: node scripts/test-ai-control-plane.mjs
      # Three checks, one step, and deliberately not three steps.
      #
      # `validate-repo.mjs` calls `validate-workspace-deps.mjs` (every workspace
      # must declare the packages its own files import, test files included) and
      # `validate-turbo-graph.mjs` (no task may read a directory another task in
      # its package declares as an output without waiting for it). Both also run
      # as standalone scripts and both print their own failure text, which names
      # the workspace, the file, the specifier and the remedy -- so a separate
      # step here would re-run the same check on the same runner in the same job
      # and buy a step name. That is the trade this file already weighed and
      # rejected for the transport suite further down, and the answer is the same.
      - name: Validate repository structure
        id: repo-validate
        run: node scripts/validate-repo.mjs
      # Runs the instruction-surface suite AND, delegated from its last block,
      # the two suites for the checks named above -- the root `package.json` could
      # not be edited in the round that wrote them, so `test-validate-repo.mjs` is
      # what invokes them until `test:scripts` names them directly. See the block
      # at the bottom of that file.
      - name: Test repository structure validator
        id: repo-suite
        run: node scripts/test-validate-repo.mjs
      - name: Test environment validator
        id: env-suite
        run: node scripts/test-validate-env.mjs
      # Now part of `npm run test:scripts`. It was not, for a scope reason rather
      # than a preference -- `package.json` was outside PL-AI-0003's allowedPaths,
      # so the alias could not be extended in the same round the suite was
      # written -- and this step was what stopped the suite being the thing the
      # note above warns about: written, committed, and executed by no gate. The
      # follow-up landed, and the step stays either way, exactly like the four
      # above it.
      #
      # No network, no API key, no live control state: every scenario plans over
      # fixtures it builds itself, and the two that read control/adapters.json
      # assert only that the shipped configuration refuses.
      - name: Test the optional dispatcher
        id: dispatcher-suite
        run: node scripts/cloud/test-dispatcher.mjs
      # The sixth, and it had no step either. 30 cases over the Windows
      # lifecycle harness -- the section-F plan parser, the installed-identity
      # derivation and the residue classifier. All pure functions plus the
      # harness's own refusal to run off win32, so it runs here on ubuntu and
      # proves exactly the part that is platform-independent. The harness
      # ITSELF running on Windows is PW-0602's business, in windows.yml.
      - name: Test the Windows lifecycle harness
        id: windows-lifecycle-suite
        run: node --test scripts/windows/test-lifecycle.mjs
      # Run by NOTHING before this step -- not by a CI step and not by any npm
      # alias (PL-0714). 17 cases over the third-party licence decisions that
      # go into the installer: which manifest shapes declare a licence, which
      # filenames are licence text, the four declared/shipped verdicts, and the
      # rendering of the notices document.
      #
      # WHY IT IS INVOKED BY PATH RATHER THAN THROUGH turbo. `apps/desktop` is
      # not an npm workspace, so turbo never reaches it. Making it one was
      # MEASURED in round 106 and reverted: a dependency-free package.json
      # there costs 8 lockfile lines and turbo does pick the suite up, but
      # `validate-workspace-deps.mjs` then walks
      # `apps/desktop/sidecar/server/` -- GENERATED packaging output, carrying
      # its own `.gitignore` of `*` -- sees `server.js` importing `next`, and
      # demands the manifest declare it. The validator's skip list has
      # node_modules, .next, dist and .turbo and not sidecar, because until now
      # no workspace contained one. So the workspace route trades one orphaned
      # suite for a broken repository validator, and `repo:validate` matters
      # more. The account is in coordination/WINDOWS_LIFECYCLE_WIRING.md §8.
      - name: Test the installer's third-party notices
        id: notices-suite
        run: node --test apps/desktop/scripts/notices.test.mjs

      # ====================================================================
      # THE MIRROR IS NOW CHECKED BY A MACHINE (PL-0714)
      # ====================================================================
      #
      # Everything above this step is a hand-maintained copy of
      # `npm run test:scripts`, and the comment that introduces it has asked a
      # human to keep the copy in step since the file was written. It has not
      # worked. It failed once before PL-AI-0002 (test-validate-repo.mjs ran on
      # somebody's laptop and nowhere else), and when PL-0714 looked it had
      # failed twice more: the alias named six scripts and this job ran four.
      # The comment was accurate, prominent, and ignored. A fourth occurrence
      # is not something to write a longer comment about.
      #
      # So this step derives the alias's script list from `package.json` and
      # the job's list from THIS FILE, and fails when they disagree. Adding a
      # script to the alias and forgetting the step is now a red build with the
      # missing name in it, not a suite that quietly runs nowhere.
      #
      # IT CHECKS ONE DIRECTION DELIBERATELY: every script in the alias must
      # have a step. The reverse is allowed, because this job legitimately runs
      # things the alias does not -- `ai-control-plane.mjs validate`,
      # `validate-repo.mjs`, and the notices suite above, which cannot be in
      # the alias for the workspace reason stated there.
      #
      # IT LIVES INLINE RATHER THAN IN `scripts/`, AND THAT IS A COMPROMISE,
      # NOT A PREFERENCE. `scripts/` is outside PL-0714's write surface. The
      # better home is `scripts/validate-ci-mirror.mjs`, called from
      # `validate-repo.mjs` so it runs locally too; it is named in PL-0714's
      # notes as the follow-up rather than silently preferred.
      - name: Every suite in `npm run test:scripts` has a step in this job
        id: mirror-check
        run: |
          cat > "${RUNNER_TEMP}/mirror-check.mjs" <<'MIRROR'
          import { readFileSync } from "node:fs";

          const alias = JSON.parse(readFileSync("package.json", "utf8")).scripts?.["test:scripts"];
          if (typeof alias !== "string") {
            console.error("mirror: package.json has no test:scripts alias to mirror.");
            process.exit(1);
          }
          const workflow = readFileSync(".github/workflows/ci.yml", "utf8");

          /* Every .mjs path the alias names, however it is invoked -- `node x`,
           * `node --test x`, joined by && or ;. Matching the PATH rather than
           * the whole command is what makes `node --test` and plain `node`
           * count as the same suite. */
          const scripts = [...alias.matchAll(/(?:^|\s)((?:[\w.@/-]+\/)*[\w.@-]+\.mjs)(?=\s|$)/g)]
            .map((match) => match[1]);
          if (scripts.length === 0) {
            console.error(`mirror: parsed no script paths out of test:scripts: ${alias}`);
            process.exit(1);
          }

          /* Only `run:` lines, so a script NAMED IN A COMMENT does not count as
           * executed. That distinction is the whole point: this file discusses
           * these filenames at length. */
          const executed = new Set(
            workflow
              .split("\n")
              .map((line) => line.trim())
              /* `run:` catches a one-line step; a bare `node ` catches a line
               * inside a `run: |` block. A YAML comment starts with `#`, so
               * neither test can match one, which is the distinction that
               * matters in a file that discusses these filenames at length. */
              .filter((line) => line.startsWith("run:") || line.startsWith("node "))
              .flatMap((line) => [...line.matchAll(/((?:[\w.@/-]+\/)*[\w.@-]+\.mjs)/g)].map((m) => m[1]))
          );

          const missing = scripts.filter((script) => !executed.has(script));
          console.log(`mirror: test:scripts names ${scripts.length} suite(s): ${scripts.join(", ")}`);
          if (missing.length > 0) {
            console.error("");
            console.error("mirror: these are in `npm run test:scripts` and have no step in the validate job:");
            for (const script of missing) console.error(`  ${script}`);
            console.error("");
            console.error("Add a step for each, beside the others, then this check passes. Do not");
            console.error("remove the script from the alias to make it pass -- that is the same");
            console.error("suite running nowhere, with the evidence deleted.");
            process.exit(1);
          }
          console.log("mirror: every suite in the alias has a step in this job.");
          MIRROR
          node "${RUNNER_TEMP}/mirror-check.mjs"
      # `npm ci` (not `npm install`): installs strictly from package-lock.json,
      # fails if the lockfile is missing or out of sync with package.json, and
      # never silently rewrites the lockfile in CI. This requires the lockfile
      # to be committed -- see PL-0001.
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      # ==================================================================
      # THE FIFTH SCRIPT IN THE ALIAS, AND IT IS HERE AND NOT ABOVE
      # ==================================================================
      #
      # The PW-0104 regression: a killed desktop invocation must leave no
      # tracked file dirty.
      #
      # IT WAS PUT IN THE PRE-INSTALL GROUP AND THAT WAS WRONG, which CI #178
      # at 975331c found: validate failed at 20m 0s with the job page naming
      # this step. The suite IMPORTS only Node builtins, which is what the
      # placement was justified on, and that was the mistake -- four of its
      # nine cases SPAWN a real `next dev` through scripts/with-root-env.mjs,
      # and `next` lives in node_modules. Reproduced in a fresh clone with no
      # node_modules: 5 passed, 4 failed, the suite's own non-vacuity guard
      # naming the cause.
      #
      # The lesson generalises and is the reason this comment is long: the
      # pre-install group's rule is about what a suite RUNS, not about what it
      # imports. Check the spawns.
      - name: Test the desktop target wrapper
        id: desktop-target-suite
        run: node scripts/test-desktop-target.mjs
      # After install, because it inspects node_modules, the lockfile, and where
      # the workspace links resolve. `--scope ci` because the two escalations it
      # turns on -- an unset cache-key variable, a runtime newer than .nvmrc --
      # are a laptop's business locally and a misconfiguration here, where the
      # cache is shared and the run is what gate evidence is recorded from.
      # `npm run env:validate` does not pass it, so the script is called
      # directly; the mode list has to be kept in step with that script by hand.
      - name: Validate environment
        id: env-validate
        run: node scripts/validate-env.mjs --scope ci --mode development --mode test --mode production
      - name: Lint
        id: lint
        run: npm run lint
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Test
        id: unit
        run: npm run test
      - name: Build
        id: build
        run: npm run build
      # ----------------------------------------------------------------------
      # NO SEPARATE TRANSPORT STEP, deliberately.
      #
      # `packages/media-inspection`'s real-socket suite -- the one that proves
      # Node consults the pinned `lookup` when it opens a connection, which is a
      # claim about the runtime that a double cannot make -- used to be excluded
      # from `npm run test` and run here on its own, behind a wrapper that gated
      # on the parsed summary line rather than on the exit code, because the run
      # exited non-zero while every assertion passed.
      #
      # That exit was a defect in the transport, not a cost of real sockets: an
      # already-aborted request built a `ClientRequest` before checking the
      # signal, which opened a socket that was then abandoned with no `error`
      # listener. It is fixed, the exclusion is gone, and the suite runs in the
      # `Test` step above like every other one. The full account lives at the
      # line that was wrong, in
      # `packages/media-inspection/src/node/pinned-fetch.ts`.
      #
      # Keeping a focused step anyway, for the clearer red mark, was weighed and
      # rejected. It would re-run the same files on the same runner in the same
      # job for no additional coverage, and it would state a second time -- as a
      # path filter -- where those tests live. One rule written twice is how this
      # repository has been bitten before, and here the copy that quietly stopped
      # matching would be the one wearing the green tick. Vitest names the
      # failing file, so the signal that step bought is already in `Test`.
      # ----------------------------------------------------------------------

      # ====================================================================
      # WHEN THIS JOB GOES RED, SAY SOMETHING (PL-0714)
      # ====================================================================
      #
      # THE PROBLEM THIS SOLVES, CONCRETELY. Run 37028642916 on 30cef6e:
      # `validate` aborted at 10m 38s with "Process completed with exit code
      # 134", after passing at 25m 4s and 27m 29s on the two runs before it,
      # on a tree whose only delta was one e2e spec, three apps/desktop
      # scripts, a doc and control-plane state. The log needs authentication;
      # so do the artifacts.
      #
      # ------------------------------------------------------------------
      # A CORRECTION THAT BELONGS HERE RATHER THAN IN A HANDOFF NOBODY
      # REREADS, because this step was partly justified on something false.
      # ------------------------------------------------------------------
      # Rounds 106 and 107 both reported that the annotation "names an exit
      # code and no step". IT NAMES THE STEP. The RUN page does not show it;
      # the JOB page does, and the job page needs no authentication either.
      # Fetched after the fact, run 37036128012's validate job says in terms:
      # exit code 134 under the step "Test AI control plane" -- which is the
      # suite that had been the prime suspect all along, confirmed by reading
      # the right URL rather than by any mechanism added here. Two rounds of
      # handoffs asserted a GitHub limitation that was a research failure.
      #
      # This step runs only on failure, so a green run pays nothing for it.
      # What it is still worth, with the above conceded:
      #
      #   1. EVERY STEP'S OUTCOME, NOT JUST THE FIRST FAILURE. The table
      #      distinguishes a step that FAILED from one that never STARTED,
      #      which an annotation cannot, and it survives the case an
      #      annotation does not cover -- a job killed without one.
      #   2. WHAT THE MACHINE LOOKED LIKE AFTERWARDS. Memory and free disk
      #      after the fact, next to the same figures taken at the start, so a
      #      run that exhausted something shows the before and the after
      #      rather than one number with nothing to compare it to.
      #   3. WHAT V8 SAID, IF IT SAID ANYTHING. `--report-on-fatalerror` is in
      #      this job's NODE_OPTIONS, so a V8 abort leaves a diagnostic report
      #      beside the process. A REDACTED extract is rendered below.
      #
      # THE REDACTION IS NOT OPTIONAL AND IS NOT A FORMALITY. A Node diagnostic
      # report contains an `environmentVariables` section -- every variable in
      # the process, verbatim -- plus `networkInterfaces`, `host` and the full
      # command line. A job summary is PUBLIC on a public run page. So the
      # report is never printed whole and never uploaded as an artifact; an
      # allowlist of named numeric and descriptive fields is extracted and
      # nothing else leaves the runner. Add a field to that list only after
      # asking what it would print on a run that had a secret in scope.
      #
      # IT DIAGNOSES AND DOES NOT TREAT. Nothing here retries, extends a
      # timeout, raises a heap, or skips a suite. The cause of exit 134 has not
      # been established, this step does not claim one, and no remedy may be
      # applied until a run produces the evidence above.
      - name: Why this job failed
        id: failure-diagnostics
        if: ${{ failure() }}
        run: |
          {
            echo "## validate — failure diagnostics"
            echo
            echo "### Which step"
            echo
            echo "The first \`failure\` is the step that aborted."
            echo
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| runner-facts | ${{ steps.runner-facts.outcome }} |"
            echo "| ai-validate | ${{ steps.ai-validate.outcome }} |"
            echo "| ai-suite | ${{ steps.ai-suite.outcome }} |"
            echo "| repo-validate | ${{ steps.repo-validate.outcome }} |"
            echo "| repo-suite | ${{ steps.repo-suite.outcome }} |"
            echo "| env-suite | ${{ steps.env-suite.outcome }} |"
            echo "| dispatcher-suite | ${{ steps.dispatcher-suite.outcome }} |"
            echo "| desktop-target-suite | ${{ steps.desktop-target-suite.outcome }} |"
            echo "| windows-lifecycle-suite | ${{ steps.windows-lifecycle-suite.outcome }} |"
            echo "| notices-suite | ${{ steps.notices-suite.outcome }} |"
            echo "| mirror-check | ${{ steps.mirror-check.outcome }} |"
            echo "| install | ${{ steps.install.outcome }} |"
            echo "| env-validate | ${{ steps.env-validate.outcome }} |"
            echo "| lint | ${{ steps.lint.outcome }} |"
            echo "| typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo
            echo "An empty outcome means the step never started."
            echo
            echo "### The machine, after"
            echo
            echo '```'
            free -h --si || true
            echo
            df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" || true
            echo '```'
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          # A V8 fatal error leaves `report.<date>.<pid>.<tid>.<seq>.json` in
          # the aborting process's working directory. `find` rather than a
          # fixed path, because that directory is whichever one the step was
          # in -- and `-newermt` is not used: a stale report cannot exist, the
          # workspace is fresh every run.
          # Read with a loop rather than `find ... | head -5`. GitHub runs this
          # step under `bash -e -o pipefail`, where `head` closing the pipe
          # early gives `find` a SIGPIPE and pipefail then aborts the whole
          # diagnostics step -- which would hide the diagnosis in exactly the
          # case it exists for. The `|| true` is on the find alone, because a
          # report that cannot be listed must not take the step down either.
          reports=()
          while IFS= read -r found; do
            reports+=("${found}")
            # `if`, not `[ ... ] && break`: under `set -e` a false test as
            # the last command of a loop body exits the step.
            if [ "${#reports[@]}" -ge 5 ]; then break; fi
          done < <(find "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" \
            -maxdepth 4 -name 'report.*.json' -type f 2>/dev/null || true)

          if [ "${#reports[@]}" -eq 0 ]; then
            {
              echo "### V8 diagnostic report"
              echo
              echo "None found. The job did not abort through a V8 fatal error — an ordinary"
              echo "non-zero exit, a killed process, or a runner-level failure leaves no report."
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/redact-report.mjs" <<'REDACT'
          import { readFileSync } from "node:fs";
          import { basename } from "node:path";

          /*
           * AN ALLOWLIST. A Node diagnostic report carries environmentVariables,
           * networkInterfaces, host and the full command line; this summary is
           * public. Nothing is taken except the fields named here.
           */
          const file = process.argv[2];
          const report = JSON.parse(readFileSync(file, "utf8"));
          const header = report.header ?? {};
          const heap = report.javascriptHeap ?? {};
          const usage = report.resourceUsage ?? {};
          const mb = (bytes) =>
            typeof bytes === "number" ? `${(bytes / 1048576).toFixed(1)} MiB` : "unknown";

          const rows = [
            ["event", header.event],
            ["trigger", header.trigger],
            ["node", header.nodejsVersion],
            ["platform", `${header.osName ?? "?"} ${header.osRelease ?? ""} ${header.arch ?? ""}`],
            ["cpus", Array.isArray(header.cpus) ? header.cpus.length : "unknown"],
            ["heap limit", mb(heap.memoryLimit)],
            ["heap committed", mb(heap.totalCommittedMemory)],
            ["heap used", mb(heap.usedMemory)],
            ["external", mb(heap.externalMemory)],
            ["rss", mb(usage.rss)],
            ["peak rss", mb(usage.maxRss)],
            ["free memory", mb(usage.free_memory)],
            ["total memory", mb(usage.total_memory)],
            ["user cpu s", usage.userCpuSeconds],
            ["kernel cpu s", usage.kernelCpuSeconds]
          ];

          /* The script that was running, by BASENAME. The full command line can
           * carry arguments this repository has no control over. */
          const argv = Array.isArray(header.commandLine) ? header.commandLine : [];
          const script = argv.slice(1).find((a) => typeof a === "string" && a.endsWith(".mjs"));
          rows.push(["script", script ? basename(script) : "not a .mjs entry point"]);

          const lines = [`#### \`${basename(file)}\``, "", "| | |", "| --- | --- |"];
          for (const [label, value] of rows) {
            lines.push(`| ${label} | ${String(value ?? "unknown").replace(/\|/g, "\\|")} |`);
          }

          /* The top of the JS stack, if there was one. Frame text is this
           * repository's own function names and file paths, which are public. */
          const frames = report.javascriptStack?.stack;
          if (Array.isArray(frames) && frames.length > 0) {
            lines.push("", "```", ...frames.slice(0, 12).map(String), "```");
          }
          console.log(lines.join("\n"));
          REDACT

          {
            echo "### V8 diagnostic report"
            echo
            echo "Redacted extract. The report itself is **not** uploaded: it contains every"
            echo "environment variable of the aborting process, and this page is public."
            echo
            for report in "${reports[@]}"; do
              node "${RUNNER_TEMP}/redact-report.mjs" "${report}" || echo "_(could not parse ${report})_"
              echo
            done
          } >> "${GITHUB_STEP_SUMMARY}"

  # ==========================================================================
  # The e2e harness's TYPECHECK. Not the suite.
  # ==========================================================================
  #
  # `e2e/` is deliberately outside the npm workspaces and carries its own
  # lockfile (docs/E2E.md, "Why `e2e/` is not an npm workspace"), which means
  # the root `npm ci` above installs none of it and `turbo run typecheck` visits
  # none of it. Until now nothing in CI compiled that directory at all, while
  # the local round did -- so the harness could stop typechecking and the only
  # thing that would notice was one Windows laptop.
  #
  # A separate job rather than more steps on `validate`, for three reasons:
  # it shares nothing with the root install, so it can run in parallel; its
  # verdict stays readable when the root job goes red early, which is when you
  # most want to know whether this is also broken; and `e2e/`'s tsconfig sets
  # `forceConsistentCasingInFileNames`, which is one of the checks most likely
  # to disagree between a case-insensitive Windows filesystem and this runner.
  #
  # The SUITE is no longer absent from CI: it runs in the `e2e` job below, which
  # is the job of its own docs/E2E.md asks for. This one stays, and is not
  # redundant, for the reason its own name gives -- it compiles the harness in
  # about a minute without downloading a browser or building the application, so
  # a harness that stops typechecking is still reported as such when the suite
  # job is red for a product reason, or has not finished.
  e2e-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # `working-directory` rather than `npm --prefix e2e ci`. `--prefix` is the
      # spelling docs/E2E.md uses for `npm run`, but it has a history of being
      # ignored by `npm ci` specifically, and an install that silently ran
      # against the repository root would be a confusing failure at best and a
      # wrong one at worst.
      #
      # `--ignore-scripts` matches the agent workflows: placing files on disk
      # does not require running arbitrary dependency lifecycle code. It matters
      # more than usual here. `@playwright/test` 1.62.1 declares no install
      # script in the committed lockfile -- checked, not assumed -- but the
      # package family exists to download several hundred megabytes of browser,
      # and a lockfile refresh that reintroduced a postinstall would otherwise
      # quietly attach that download to a typecheck job. `npm run browsers` is
      # how this repository asks for browsers, explicitly, and nothing here does.
      - name: Install the e2e harness
        working-directory: e2e
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Typecheck the e2e harness
        working-directory: e2e
        run: npm run typecheck

  # ==========================================================================
  # The e2e SUITE, EXECUTED. No run of THIS JOB has been observed.
  # ==========================================================================
  #
  # PL-0701's acceptance is "reproducible in CI", and a suite that is only
  # compiled is not reproduced. Until this job existed, every e2e result this
  # repository had came from a developer running it by hand -- which is the same
  # absence-reads-as-success shape the header of this file is about.
  #
  # READ THIS BEFORE YOU TRY TO MAKE IT GREEN.
  #
  # This header said "Expected to be RED today, deliberately" and the list below
  # said the suite was PARTLY RED ON PURPOSE. Neither survives the two local
  # executions on record. docs/E2E.md, "Known blockers found by the first real
  # run", is still the authority on what is and is not established, and what
  # follows is a convenience copy -- and therefore the copy that goes stale -- it
  # has already had to be corrected once, and the stale entry was exactly the
  # hazard the baseline argument further down describes. It listed
  # `catalog.api.spec.ts` as asserting non-empty rails and therefore failing
  # under `production`; that spec has since been mode-split and requires the
  # 503 `catalog_source_not_configured` refusal under `production` and the demo
  # catalog under `development`. It is no longer an expected failure, and if it
  # is red now that is a real one. Read this list against docs/E2E.md, not
  # instead of it. As of this revision:
  #
  #   - THE TWO 404 ASSERTIONS in `critical-journey.spec.ts` have been OBSERVED
  #     PASSING, which is what this entry used to say they had never been. It
  #     read "UNKNOWN: expected to pass, never observed passing", and it was the
  #     stale half of a contradiction with docs/E2E.md, which had recorded them
  #     passing in the 2026-09-05 device-matrix run since before this comment was
  #     last read. They passed again on 2026-09-15 on the current tree, on
  #     `chromium` in both modes -- `/title/no-such-title-pl0701` 404 under
  #     `development` and the 200 `catalog_source_not_configured` refusal under
  #     `production`, `/watch/Not%20A%20Valid%20Id` 404 in both -- with neither
  #     served-bytes skeleton check finding its string.
  #     THAT 2026-09-15 RUN USED A SUBSTITUTED BROWSER REVISION, and this entry
  #     did not say so when it was written. It launched chromium 1194 behind a
  #     symlink shim presenting it as 1234, because `playwright install` could
  #     not reach the CDN from that container; the caveat was disclosed in
  #     docs/E2E.md and in the gate evidence, and the commander ruled it narrow
  #     local evidence and NOT pinned-browser verification. A third run, later
  #     the same day, re-ran both modes on the PINNED revision 1234 (Chrome for
  #     Testing 151.0.7922.34) from Playwright's default cache, with the
  #     container's `PLAYWRIGHT_BROWSERS_PATH` unset for the run so it resolved
  #     there rather than at the 1194 tree that variable pointed at. Same
  #     statuses, same counts -- development 43 passed / 3 skipped, production
  #     34 passed / 12 skipped, exit 0 both -- and nothing behaved differently on
  #     the newer engine. THAT is the run to cite; the shim numbers are
  #     corroboration. Observed three times is still
  #     not guaranteed: `retries` is 0, and none of the three was this job on a
  #     GitHub runner. Both halves of PL-0704's
  #     repair have landed. Each existence decision now sits above every
  #     Suspense boundary its own page declares, AND the three loading files
  #     that installed a boundary above a segment are deleted:
  #     `apps/web/src/app/loading.tsx`,
  #     `apps/web/src/app/title/[titleId]/loading.tsx` and
  #     `apps/web/src/app/watch/[contentId]/loading.tsx`. The skeletons were
  #     relocated rather than surrendered -- home into a `<Suspense>` inside
  #     `app/page.tsx`, the player into one inside `watch/[contentId]/page.tsx`,
  #     both BELOW the decision -- and the title route deliberately has none,
  #     because whether a title exists IS the load there. That last one is now a
  #     RULED EXEMPTION in PL-0704's acceptance rather than a deviation from it,
  #     it carries its reasoning, and it is reversible: the moment the title page
  #     grows a section that can wait on something other than the title's
  #     existence, it must gain an in-page Suspense below the decision and the
  #     keep-the-skeletons clause binds again. Both gates assert that now -- the
  #     e2e suite requires `/title/<demo id>` to answer 200 with no streamed
  #     shell, and the unit guard fails if a `<Suspense>` appears on that page
  #     without a named skeleton as its fallback. Note the unknown-title
  #     404 is asserted under `development` only: on a hosted build the metadata
  #     source throws, `loadTitleDetail` reports `error` rather than
  #     `not-found`, and the spec requires the 200 refusal there instead.
  #     `apps/web/src/app/watch/route-loading-boundaries.test.ts` runs in the
  #     `validate` job and is the authority on whether a boundary has crept back
  #     above a `notFound()`-capable page -- it, not this comment and not
  #     docs/E2E.md;
  #   - `search.spec.ts`'s typing tests passed on `chromium` in both modes on
  #     2026-09-15, including "text typed before hydration survives it", which
  #     was the single red of the 2026-09-05 device-matrix run. They passed again
  #     in the pinned-revision run of the same day. That is ONE
  #     browser project. docs/E2E.md keeps the blocker entry open because it was
  #     found on four, and PL-0705's acceptance names WebKit specifically; this
  #     job launches neither WebKit nor Firefox and claims nothing about them;
  #   - `development`-ONLY ASSERTIONS ARE NO LONGER UNKNOWN AS A CLASS. This
  #     entry said no `development` run had happened since `allowedDevOrigins`
  #     was added to `apps/web/next.config.ts`; three have, on 2026-09-05 and
  #     twice on 2026-09-15, and the last of them was green across `api` and
  #     `chromium` on the pinned browser revision. So the
  #     production half of each pair is no longer unproven to be non-vacuous
  #     either. The development step below still runs even after the production
  #     step has failed, for the unchanged reason: one red mode must not hide the
  #     other.
  #
  # WHAT THIS JOB DOES NOT DO ABOUT THAT. No `continue-on-error`. No `|| true`.
  # No `--pass-with-no-tests`, no retries (`retries: 0` is set in
  # `playwright.config.ts` and is deliberate there). The job fails when the suite
  # fails, and whatever mark that produces is the accurate state of the harness.
  # This sentence used to add "which today means this job is RED"; that stopped
  # being true and is the second stale prediction this block has carried.
  # A green tick over a red suite is the audit fiction this
  # repository keeps deleting; a job that reports "known failures only" while
  # nobody maintains the list of known failures is the same fiction with an
  # inventory attached.
  #
  # An expected-failure BASELINE was considered and rejected, and the reason is
  # not effort. To separate expected from unexpected honestly, the list of
  # expected failures has to be machine-readable, live beside the specs, and be
  # deleted from as they are fixed -- and nothing in this repository produces or
  # checks such a list today. Writing one into this workflow would put the
  # authoritative statement of "which failures are acceptable" in the file
  # furthest from the tests, where its first stale entry silently absorbs a real
  # regression. If a baseline is wanted, it belongs in `e2e/` with a test that
  # fails when an entry stops failing, and that is PL-0701's surface, not this
  # file's.
  #
  # SO: this job is green only when the suite is green in both modes. The local
  # runs above say the suite IS green in both modes, for the two projects this
  # job runs -- but a local run on a container is not this job, and until this
  # workflow has actually reported, "expected green" is the same kind of claim
  # "expected to pass" was for the 404s. The entries above are what to read a
  # result against; they are not a prediction of one.
  #
  # BOTH MODES, and the second is not optional. docs/E2E.md, "Both modes are the
  # gate, not a choice": the strings the `production` half requires to be ABSENT
  # are the strings the `development` half requires to be PRESENT, so a
  # production-only run proves a refusal and never proves it is not vacuous. The
  # development step therefore runs even when the production step has already
  # failed -- otherwise one red mode would hide the other entirely, and the pair
  # would degrade to whichever half ran first.
  #
  # `api` and `chromium` only, which is exactly the pair docs/E2E.md names as the
  # gate commands. WebKit, mobile-safari and Firefox are NOT run here and this
  # job claims nothing about them. Chromium is the engine this runner image
  # already carries shared libraries for; WebKit's are a separate set that a
  # plain `playwright install` does not place, and the usual remedy --
  # `playwright install --with-deps` -- is a root `apt-get` on Linux and throws
  # outright on Windows, so it is not the spelling this repository standardises
  # on. Adding those engines is a deliberate second job, with whatever
  # dependency installation it turns out to need stated in it; until then WebKit
  # evidence (PL-0705's acceptance requires it) comes from a local run and is
  # recorded as such. Only the browser this job launches is downloaded, so
  # nothing waits on builds it will never start.
  e2e:
    runs-on: ubuntu-latest
    # A ceiling for a hang, not a budget. One cold `turbo run build` for the
    # production run, an on-demand dev compile for the other, and two suite runs
    # finish well inside this; the default 360 minutes is what a stuck server
    # would otherwise burn.
    timeout-minutes: 45
    # The same three @cache-key variables the `validate` job pins, for the same
    # reason: `playwright.config.ts` runs `npm run build` through turbo inside its
    # `webServer` command, so an unset one hashes as ABSENT into the shared build
    # cache and this job could be served an artifact built under a different
    # enforcement mode. The harness pins CONTENT_RIGHTS_ENFORCEMENT and
    # LIBERTY_FIXTURE_MEDIA_ORIGIN on the server process itself as well, to the
    # same values; setting them here is about what turbo hashes BEFORE that
    # process starts.
    env:
      CONTENT_RIGHTS_ENFORCEMENT: strict
      LIBERTY_FC_SEED: "20250819"
      LIBERTY_FIXTURE_MEDIA_ORIGIN: https://fixtures.invalid
      # The database the PRODUCTION run's identity system is built on. One
      # expression, used by the migration step and handed to the harness below,
      # so a run cannot migrate one database and then test against another.
      LIBERTY_E2E_POSTGRES_URL: postgres://liberty:liberty@127.0.0.1:5432/liberty_e2e
    # =======================================================================
    # A REAL IDENTITY SYSTEM FOR THE PRODUCTION RUN (PW-0312, round 93)
    # =======================================================================
    #
    # WHY THIS SERVICE EXISTS. Until this round no job in this repository ran a
    # database, so every production-mode e2e run was a DEPLOYMENT WITH NO
    # IDENTITY SYSTEM -- and in round 92 that gap was used as an argument for
    # letting such a deployment serve playback without authenticating anybody.
    # gpt-architect's security review failed it and said what to do instead:
    # "The fact that .github/workflows/ci.yml currently has no PostgreSQL
    # service is NOT a reason to preserve an authentication bypass. Fix the
    # harness."
    #
    # WHAT IT BUYS. The production run can now create an account, sign in, and
    # exercise the five cases the verdict named: signed-out -> 401
    # unauthenticated; signed-in valid -> the deployment's real decision;
    # signed-in malformed -> 400; a session store consulted about a cookie it
    # has no row for -> 401 rather than a 503; and no content-existence leak
    # while signed out.
    #
    # THE DEVELOPMENT RUN IS DELIBERATELY NOT GIVEN ONE. Case 5 of the ruling
    # preserves the development identity mechanism -- headers, no session store
    # -- and the way to preserve something is to keep running it.
    #
    # PINNED TO AN EXACT TAG rather than `postgres:latest`, for the reason every
    # other version in this repository is pinned: a gate is recorded against
    # what was run, and `latest` means the database a passing result was
    # recorded against can change with no commit saying so.
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: liberty
          POSTGRES_PASSWORD: liberty
          POSTGRES_DB: liberty_e2e
        ports:
          - 5432:5432
        # Without this the steps below race the container's first start, and the
        # failure is a connection refused that reads like a product fault.
        options: >-
          --health-cmd "pg_isready -U liberty -d liberty_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # BOTH lockfiles, because this job installs both trees. Stated rather
          # than derived, for the reason the `validate` job gives: an implicitly
          # chosen key that matched only one of them would restore a
          # node_modules that does not match the install about to run.
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      # The application first: `playwright.config.ts` starts the server with
      # `npm run build && npm run start --workspace @liberty/web` (or `npm run
      # dev` in development mode) from the REPOSITORY ROOT, so the root install
      # is a prerequisite of the harness rather than a separate concern.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the e2e harness
        working-directory: e2e
        run: npm ci --no-audit --no-fund --ignore-scripts
      # `--ignore-scripts` above means no browser arrives with the install, which
      # is the point: browsers are asked for explicitly, here, and only the one
      # this job launches. NOT `--with-deps` -- see the note above the job.
      #
      # THIS IS WHAT MAKES THE JOB'S RUN A PINNED-REVISION RUN, and it is worth
      # naming because the amended PL-0704 acceptance asks for one. `playwright
      # install` takes the revision from the installed `@playwright/test`, which
      # `e2e/package.json` pins to 1.62.1 exactly and `e2e/package-lock.json`
      # fixes -- so this step downloads chromium 1234 and the run launches it.
      # Nothing here selects a browser by version number, and nothing should:
      # a literal here would be a second place to update and a silent way to
      # disagree with the lockfile.
      #
      # The one way this goes wrong is an environment that sets
      # PLAYWRIGHT_BROWSERS_PATH to a tree holding a different revision -- then
      # both this step and the runs below resolve there, and the suite either
      # fails to find an executable or, if something has been made to fit the
      # expected names, silently tests a browser nobody pinned. A GitHub-hosted
      # `ubuntu-latest` runner sets neither that variable nor
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD, so the default cache is used; the
      # local container that produced the 2026-09-15 evidence DID set both, and
      # the first of the two runs recorded there was on a substituted revision
      # because of it. If a self-hosted runner is ever adopted, check this
      # before trusting a green mark from it.
      - name: Install the browser this job launches
        id: browsers
        working-directory: e2e
        run: npx playwright install chromium
      # ===================================================================
      # THE MIGRATION, APPLIED DIRECTLY AND THEN VERIFIED
      # ===================================================================
      #
      # NOT `npm run db:migrate -w @liberty/persistence`, AND THE REASON IS A
      # DEFECT RATHER THAN A PREFERENCE. That script runs `drizzle-kit migrate`,
      # which decides what to apply by reading
      # `packages/persistence/migrations/meta/_journal.json`. That file does not
      # exist: the first migration was hand-written -- its own header says so --
      # so no `drizzle-kit generate` run ever produced a journal. The command
      # therefore APPLIES NOTHING AND EXITS 0. Verified against a live
      # PostgreSQL 16 while this job was being written: fresh database,
      # `drizzle-kit migrate` with a real connection string, exit 0, zero
      # relations afterwards.
      #
      # `packages/persistence/**` is not on PW-0312's surface and this job does
      # not fix it; the defect is filed as its own proposal for gpt-architect.
      # What this job does instead is apply the committed SQL with `psql` and
      # then ASSERT THE TABLES EXIST -- because the failure this routes around
      # was SILENT, and a migration step that cannot fail loudly is how it
      # stayed silent.
      - name: Apply the repository migration
        id: migrate
        run: |
          set -euo pipefail
          psql "$LIBERTY_E2E_POSTGRES_URL" \
            --set ON_ERROR_STOP=1 \
            --quiet \
            --file packages/persistence/migrations/0000_profile_scoped_identity.sql
          # The four Better Auth tables plus the four Liberty ones. A count
          # rather than a spot check, so a partially applied migration fails
          # here instead of becoming a confusing 500 three steps later.
          applied=$(psql "$LIBERTY_E2E_POSTGRES_URL" --tuples-only --no-align --command \
            "select count(*) from information_schema.tables
             where table_schema = 'public'
               and table_name in ('user','session','account','verification',
                                  'profile','active_profile_selection',
                                  'playback_progress','watchlist_entry')")
          echo "migration created $applied of 8 expected tables"
          test "$applied" -eq 8
      - name: Run the suite in production mode
        id: production
        if: ${{ steps.browsers.outcome == 'success' && steps.migrate.outcome == 'success' }}
        working-directory: e2e
        env:
          LIBERTY_E2E_WEB_MODE: production
          # WHAT MAKES THIS RUN THE ONE WITH AN IDENTITY SYSTEM. `src/env.ts`
          # derives the auth secret from this variable's presence, so there is
          # no run in which a store is configured and a secret is not.
          LIBERTY_E2E_DATABASE_URL: ${{ env.LIBERTY_E2E_POSTGRES_URL }}
        run: npm test -- --project=api --project=chromium
      # Uploaded between the two runs, not after both: the HTML reporter writes
      # to one directory and the development run overwrites it.
      - name: Upload the production report
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: warn
      - name: Run the suite in development mode
        id: development
        # Runs even when the production run failed. That is not tolerance of the
        # failure -- the job is already red and stays red -- it is the pairing
        # above: one mode's result is not evidence about the other.
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        working-directory: e2e
        env:
          LIBERTY_E2E_WEB_MODE: development
          # NO DATABASE, ON PURPOSE, and it is not an omission. Case 5 of
          # gpt-architect's round-93 semantics: "Explicit
          # non-deployment/development identity behavior may remain governed by
          # the existing development capability/rules." A development process
          # resolves an identity from headers and never consults a session
          # store, and running it that way is how that stays true.
        run: npm test -- --project=api --project=chromium
      - name: Upload the development report
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-development
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: warn
