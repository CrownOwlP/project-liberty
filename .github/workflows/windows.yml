name: Windows package

# ============================================================================
# THE WINDOWS PACKAGING AND RELEASE JOB (PW-0501)
# ============================================================================
#
# WHY THIS FILE IS THE ONLY WAY THIS WORK CAN BE BUILT AT ALL. The cloud
# engineering session has a Linux-only Rust toolchain and the linked machine
# exposes a Linux VM, so no Windows binary can be produced or run there. A
# `windows-latest` runner is not a nicety here -- it is the substitute for a
# developer machine, and it is the only build machine this project has.
#
# WHAT THIS WORKFLOW OWNS, AND WHAT IT MUST NOT TAKE FROM ITS NEIGHBOUR.
# `.github/workflows/desktop-shell-ci.yml` is PW-0102's and establishes that
# the shell CRATE builds and its tests pass on Windows. Its header says what it
# must never grow into -- "no release signing, no MSI or NSIS packaging, no
# installer or update evidence, and no release artifact responsibility" -- and
# names this file as where those belong. The split is gpt-architect's round-87
# ruling; do not merge them.
#
# ============================================================================
# WHAT THIS JOB PROVES, AND WHAT IT CANNOT
# ============================================================================
#
# PROVES, because CI observes it:
#   - the desktop-target web build produces a Next standalone tree;
#   - the sidecar lays out against the Rust constants that read it;
#   - `tauri build` produces exactly one MSI and one NSIS installer;
#   - the exact artifact inventory, with SHA-256 digests;
#   - the MSI installs silently, puts the application where it says, and
#     uninstalls without leaving it behind.
#
# CANNOT PROVE, and no gate recorded from this job may claim it:
#   - that the application LAUNCHES. Nothing here starts it. A runner has no
#     attended session, no GPU worth the name and nobody to look at a window.
#   - that WebView2 renders anything, or that a child HWND composites beneath
#     it. That is PW-0103, and it needs the commander's hardware.
#   - anything about signing. These artifacts are UNSIGNED and say so in the
#     inventory. PW-0502 depends on an owner-held Authenticode certificate;
#     coordination/LAST_MILE.md item 6 records it.
#
# ============================================================================
# NO `continue-on-error`, NO `|| true`
# ============================================================================
#
# The acceptance asks for it by name and the e2e job already states the rule.
# Every step below either succeeds or fails the job. The one place a shell
# script could swallow a failure silently -- a PowerShell block, which does NOT
# stop on a non-zero native exit code by default -- sets
# `$ErrorActionPreference` and checks `$LASTEXITCODE` explicitly.
#
# ----------------------------------------------------------------------------
# THE ONE EXCEPTION IS GONE, AND THE RECORD OF IT STAYS
# ----------------------------------------------------------------------------
#
# Round 107 added the lifecycle harness beside the inline install block with
# `continue-on-error: true` -- the only such step this file has ever had --
# because the harness had 30 unit cases and zero runs against a real Windows
# machine, and this job is the only reliably green signal the project has.
# The condition written here for removing it was: read its first real report,
# fix what it shows, then arm.
#
# ROUND 109 DID THAT. Run 37131258670 at 4f23c1d reported F1 PASS, F2 NOT-RUN
# with its reason, F3 PASS and F4 PASS, by annotation -- and F3 passing means
# the residue classifier met the runner's real service, scheduled-task and
# process lists and accused none of them, which was the specific thing that
# would have made arming wrong. Nothing needed fixing. The inline block is
# gone, the harness is the gate, and `continue-on-error` appears nowhere in
# this file.
#
# WHAT WAS KEPT FROM THE INLINE BLOCK, deliberately and as its own step: the
# NEGATIVE verification. The harness never points `verify-install.mjs` at a
# directory that is not an install, and without that check a verifier that
# returned 0 unconditionally would make every lifecycle PASS meaningless.
#
# ROUND 107's OTHER CLAIM WAS WRONG AND IS CORRECTED HERE. It said the report
# written to `$GITHUB_STEP_SUMMARY` "renders on the run page", and it does
# not -- the first run published a verdict nobody could read. The per-case
# outcomes are emitted as ANNOTATIONS now, which is the one channel this
# project has ever been able to read without a login; the summary is kept for
# a human in a browser, where it is more legible.
#
on:
  push:
    # Narrower than ci.yml's deny-list trigger, for the reason
    # desktop-shell-ci.yml gives about its own: this job installs a Rust
    # toolchain, compiles a large dependency graph, downloads the WiX and NSIS
    # toolchains and then INSTALLS an MSI on the runner. It is the most
    # expensive minute this repository spends, and spending it on a commit that
    # cannot affect the package is waste.
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/windows/**"
      - ".github/workflows/windows.yml"
      - "package-lock.json"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/windows/**"
      - ".github/workflows/windows.yml"
      - "package-lock.json"
  # The autonomous loop cannot rely on push events: GitHub does not fire
  # push-triggered workflows for commits made with the default GITHUB_TOKEN.
  # ci.yml and desktop-shell-ci.yml record the same constraint.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hashed into the turbo build cache key and required by
  # `validate-env.mjs --scope ci`; an unset one hashes as ABSENT and this job
  # could be served an artifact built under a different enforcement mode.
  CONTENT_RIGHTS_ENFORCEMENT: strict
  LIBERTY_FIXTURE_MEDIA_ORIGIN: https://fixtures.invalid
  # PINNED TO THE CRATE. `apps/desktop/src-tauri/Cargo.toml` pins
  # `tauri = "=2.12.0"`, and the CLI that drives it is pinned to the same
  # number. A caret here would mean the bundler a passing gate was recorded
  # against can change under a lockfile nobody edited -- the argument
  # Cargo.toml already makes about every one of its own versions.
  TAURI_CLI_VERSION: "2.12.0"

jobs:
  package:
    runs-on: windows-latest
    # A ceiling for a hang, not a budget. A cold Rust compile of the Tauri
    # graph, a Next build, a WiX download and an MSI install fit inside this;
    # the default 360 minutes is what a stuck installer would otherwise burn.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        id: checkout

      # THE NODE THAT SHIPS INSIDE THE APPLICATION COMES FROM HERE, and that is
      # the answer `package-sidecar.mjs` demands in its own header: "which one
      # ships is a release decision with a supply-chain answer attached -- a
      # pinned version, a checksum, and a place it came from."
      #
      # The version is `.nvmrc`, the same file every other job reads, so the
      # runtime inside the installer is the runtime the repository develops
      # against. `actions/setup-node` downloads it from nodejs.org and verifies
      # the published checksum; that is the provenance, and it is better than
      # any binary this repository could vendor.
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # PINNED, NOT `stable`, for the reason desktop-shell-ci.yml gives: a gate
      # is recorded against what was built, and `stable` means the toolchain
      # that produced a passing result can change with no commit saying so.
      - name: Install the pinned Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"

      - uses: Swatinem/rust-cache@v2
        id: rustcache
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      # ==================================================================
      # THE SIDECAR: the application server that ships inside the bundle
      # ==================================================================
      #
      # `build:desktop` is the intentional desktop build path `apps/web`
      # exposes -- the same script a human would run -- and it is what sets
      # `output: "standalone"` through LIBERTY_BUILD_TARGET. Running `next
      # build` with a variable bolted on here instead would exercise a private
      # arrangement that only works in CI.
      - name: Build the application server for the desktop target
        id: webbuild
        run: npm run build:desktop --workspace @liberty/web

      - name: Lay out the packaged sidecar
        id: sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The runtime setup-node just installed and verified. Resolved rather
          # than assumed: the runner's PATH decides which node is current, and
          # hard-coding a path would ship whatever happened to be at it.
          $node = (Get-Command node).Source
          Write-Host "sidecar runtime: $node"
          & node --version
          $env:LIBERTY_SIDECAR_NODE = $node
          & node apps/desktop/scripts/package-sidecar.mjs
          if ($LASTEXITCODE -ne 0) { throw "package-sidecar failed with $LASTEXITCODE" }

      # ==================================================================
      # THE BUNDLE
      # ==================================================================
      #
      # `npx --yes @tauri-apps/cli@<exact>` rather than a dependency in a
      # manifest, and the trade is stated rather than hidden. `apps/desktop`
      # is not an npm workspace member -- the root declares `apps/*`, so adding
      # a package.json there would make it one, put a large prebuilt binary
      # into `npm ci` for every ubuntu job that does not need it, and change
      # the root lockfile, which is not on this task's surface.
      #
      # THE COST: the pin lives in this file's `env` block rather than in a
      # lockfile, so it is exact but not integrity-checked. Moving it into a
      # lockfile is the better long-term home and is blocked only on the root
      # manifest surface; it is raised rather than quietly preferred.
      - name: Build the Windows installers
        id: bundle
        working-directory: apps/desktop
        run: npx --yes "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build

      # ==================================================================
      # WHAT WAS ACTUALLY PRODUCED
      # ==================================================================
      #
      # `tauri build` exits 0 having produced whatever it produced. This step
      # is what turns that into a claim: exactly one MSI and exactly one NSIS
      # installer, each with a digest. It FAILS when the set is wrong -- none,
      # or a stale artifact from an earlier build sitting beside the new one --
      # which is the difference between a build step and a gate.
      - name: Publish the artifact inventory
        id: inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          & node scripts/windows/artifact-inventory.mjs --bundle $bundle --out artifact-inventory.json
          if ($LASTEXITCODE -ne 0) { throw "artifact-inventory failed with $LASTEXITCODE" }
          Get-Content artifact-inventory.json

      # ==================================================================
      # THE NEGATIVE VERIFICATION, WHICH THE HARNESS DOES NOT DO
      # ==================================================================
      #
      # ALL THAT SURVIVES OF THE INLINE INSTALL BLOCK, and it survives on
      # purpose. `scripts/windows/lifecycle.mjs` performs F1, F3 and F4 --
      # install, uninstall with residue classification, reinstall -- and it
      # verifies the installed tree by deriving the paths from the Rust
      # constants the shell compiles. What it does NOT do is point
      # `verify-install.mjs` at a directory that is not an install and require
      # it to refuse.
      #
      # A VERIFICATION THAT HAS NEVER BEEN SEEN TO FAIL IS A VERIFICATION
      # NOBODY HAS TESTED. The inline block ran this on every run from round 99
      # and deleting it with the rest would have quietly removed the one check
      # that keeps the positive check honest: a `verify-install.mjs` that
      # returned 0 unconditionally would make every F1 and F4 below a pass.
      #
      # ------------------------------------------------------------------
      # AND IT COULD NOT SUCCEED, FOR TWO ROUNDS (PL-0733)
      # ------------------------------------------------------------------
      #
      # Windows #16 failed here, and PW-0602's step-id diagnostics named it:
      # "FIRST FAILING STEP: verifier-negative (failure). Everything after it
      # did not run." Everything before it succeeded, `lifecycle` was skipped,
      # and `upload-installers` was skipped -- so the harness this job exists
      # to run has never run, behind a step that could not pass.
      #
      # REFUSING IS THIS STEP'S SUCCESS CASE. `node` exits 1 when the verifier
      # does the right thing. PowerShell 7.4 stabilised
      # `$PSNativeCommandUseErrorActionPreference`, which turns a native
      # command's non-zero exit into a TERMINATING error under
      # `$ErrorActionPreference = "Stop"` -- so on a runner where it is on, the
      # `node` line threw before `$LASTEXITCODE` was ever read. The step failed
      # when the verifier refused (PowerShell threw) and would have failed when
      # it accepted (the explicit `throw`). There was no passing path.
      #
      # IT DID NOT REPRODUCE LOCALLY, WHICH IS WHY IT SURVIVED. This
      # container's pwsh 7.4.6 defaults that preference to False and the step
      # exits 0. Forcing it true reproduces the runner exactly:
      # 'Program "node" ended with non-zero exit code: 1.'
      #
      # SO THE PREFERENCE IS PINNED HERE RATHER THAN INHERITED. A step whose
      # correctness depends on an image's PowerShell configuration is one that
      # breaks again when the image moves, and nothing in this repository can
      # observe that from outside. `$ErrorActionPreference` stays `Stop` for
      # everything else in the step; only the native-exit rule is overridden,
      # and only because a non-zero exit is the ANSWER here rather than a
      # failure.
      #
      # THE CHECK ITSELF IS UNCHANGED: accepting a non-install still throws.
      # That is the whole point of the step and its comment above says why.
      - name: The install verifier refuses a directory that is not an install
        id: verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # See PL-0733 above. A non-zero exit from `node` is this step's
          # success condition, so it must not be a terminating error.
          $PSNativeCommandUseErrorActionPreference = $false

          node scripts/windows/verify-install.mjs "${env:TEMP}"
          $code = $LASTEXITCODE

          # REPORTED AS AN ANNOTATION, because annotations are the only CI
          # channel the engineering session can read and the diagnosis above
          # was reached by reproduction rather than by reading this runner's
          # log. The next run says the exit code out loud, so it confirms or
          # refutes that diagnosis without anybody needing a login.
          Write-Host "::notice title=verifier-negative::verify-install exited $code against a directory that is not an install. Non-zero is correct here; 0 would mean it accepted one, and every lifecycle PASS below would be meaningless."

          if ($code -eq 0) {
            throw "verify-install.mjs passed against a directory that is not an install; every lifecycle PASS below would be meaningless"
          }
          Write-Host "verify-install: correctly refused a non-install directory"

          # ==============================================================
          # AND THE STEP MUST EXIT 0, WHICH THE LINE ABOVE DOES NOT DO.
          # ==============================================================
          #
          # WINDOWS #17 IS WHY THIS LINE EXISTS. PL-0733's repair above was
          # correct and INCOMPLETE: the run printed its notice --
          # "verify-install exited 1 against a directory that is not an
          # install" -- and then failed anyway, at the same step, with the
          # same `verifier-negative (failure)`. Execution had reached the
          # end of the body; the body was not the problem.
          #
          # GitHub runs a `shell: pwsh` step as
          #   pwsh -command ". '<file>'; if ((Test-Path -LiteralPath
          #                 variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
          # so the STEP's exit code is `$LASTEXITCODE` as it stands when the
          # body ends -- and `$LASTEXITCODE` is still 1, set by the `node`
          # above, whose non-zero exit is this step's SUCCESS condition.
          # `$PSNativeCommandUseErrorActionPreference = $false` stops that
          # exit becoming a terminating error. It does not clear it.
          #
          # Two distinct mechanisms, one symptom, and the first fix only
          # addressed the first of them.
          #
          # REPRODUCED, not reasoned about: pwsh 7.4.6, the body above run
          # through that exact wrapper. With the node child exiting 1 the
          # step exits 1 without this line and 0 with it; with the child
          # exiting 0 -- the verifier wrongly ACCEPTING a non-install -- the
          # throw fires and the step exits 1 either way, which is the half
          # that must not regress.
          exit 0

      # ==================================================================
      # THE LIFECYCLE HARNESS, OBSERVED BEFORE IT IS TRUSTED (PW-0602)
      # ==================================================================
      #
      # WHAT THIS ADDS THAT THE INLINE BLOCK ABOVE CANNOT. The inline block
      # installs, verifies and uninstalls. `scripts/windows/lifecycle.mjs`
      # performs the AUTO half of `docs/WINDOWS_CERTIFICATION.md` section F --
      # the document that already assigns each lifecycle row an owner -- and
      # three things fall out of that which an inline PowerShell block does not
      # have:
      #
      #   - it DERIVES the installed paths from `src-tauri/src/sidecar.rs`, the
      #     constants the shell itself compiles, rather than restating them
      #     here. Restating them in a third place is what turned this job's
      #     only install assertion into a check that the MSI carried a file
      #     nothing starts (round 99);
      #   - it CLASSIFIES residue after uninstall -- leftover service,
      #     scheduled task, process still running out of the install root,
      #     install-root leftovers -- by install-root containment and by the
      #     product's own registered names, never by the substring "liberty",
      #     so it cannot accuse the runner's own software;
      #   - it performs F4, REINSTALL, which nothing in this job does today.
      #
      # IT IS THE GATE NOW, AND IT REPLACED THE INLINE BLOCK (round 109). It
      # ran once in observation mode, on run 37131258670 at 4f23c1d, and the
      # per-case annotations said: F1 clean install PASS, F2 upgrade NOT-RUN
      # with its reason, F3 uninstall PASS -- which is only reachable when
      # `classifyResidue` returns clean against the runner's REAL service,
      # scheduled-task and process lists -- F4 reinstall PASS, tally
      # "not-run=1 pass=3". The three hazards section 6 of
      # `coordination/WINDOWS_LIFECYCLE_WIRING.md` named were each answered by
      # that run rather than by argument, which is what the two-commit plan
      # asked for before arming.
      #
      # NOTHING INSTALLS BEFORE IT ANY MORE, which is what keeps F1 honest: the
      # harness reports F1 as `not-run` rather than as a pass when the install
      # root already exists, and with the inline block gone this step meets a
      # machine on which nothing has been installed. The install root is still
      # probed and printed first so that a future `not-run` reads as the fact
      # it is rather than as a mystery.
      #
      # WHAT IT STILL CANNOT PROVE, and no gate recorded from it may claim:
      # that the application LAUNCHES. F1's launch half needs an attended
      # desktop session; it is PW-0504 and it is the commander's machine. F2,
      # upgrade, needs a previous release this repository has never shipped;
      # it is PW-0505 and the harness reports it `not-run` with that reason,
      # never as passed.
      # ====================================================================
      # THE ONE STEP IN THIS FILE WITH A CREDIBLE UNBOUNDED HANG (PL-0736)
      # ====================================================================
      #
      # `lifecycle.mjs` calls `spawnSync("msiexec.exe", ...)` four times with
      # NO `timeout` option. Windows Installer serialises on the `_MSIExecute`
      # mutex, and a process holding it -- an unattended-install service, a
      # previous msiexec that has not exited, a repair triggered by something
      # else on the runner -- makes the next invocation WAIT, not fail. That is
      # a hang with no deadline anywhere in the chain, in the step that decides
      # F1, F3 and F4.
      #
      # HOW THIS BOUND WAS DERIVED, including the part that is NOT an
      # observation. The step's own duration cannot be read: job logs need a
      # login and annotations, the only channel this project can read, do not
      # carry step timings. What IS observed is that the whole job -- including
      # a Rust release build, which dominates it -- completed twice inside its
      # 60-minute bound, on Windows #18 (37259195413) and #19 (37260995361).
      # A silent install, uninstall and reinstall of a local MSI is seconds of
      # work; 15 minutes is far above anything that is merely slow and far
      # below the 60 this job would otherwise spend discovering the mutex.
      #
      # THIS IS THE OUTER BOUND, NOT THE FIX. The right place for a deadline on
      # msiexec is the `spawnSync` call, where the harness could report WHICH
      # case stalled and against which mutex instead of losing the whole step.
      # `scripts/windows/` is outside this task's surface; filed as PL-0745.
      - name: Exercise the installer lifecycle (PW-0503 harness, PW-0602 gate)
        id: lifecycle
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ==============================================================
          # THE SAME TRAP AS `verifier-negative`, ONE STEP LATER (PL-0733)
          # ==============================================================
          #
          # `lifecycle.mjs` EXITS NON-ZERO ON PURPOSE, and the switch below
          # exists to say which non-zero: 1 is a real case failure, 2 is a
          # refusal over arguments or platform, and the comment on that
          # switch says collapsing them "is how a configuration mistake gets
          # filed as a product defect".
          #
          # On the runner they were collapsed. PowerShell 7.4 makes a native
          # non-zero exit a TERMINATING error under `ErrorActionPreference =
          # "Stop"`, so `& node ...` below threw at its own line: `$code` was
          # never captured, the switch never ran, and the named throw never
          # ran. The step failed with `Program "node" ended with non-zero
          # exit code: 1` and nothing else.
          #
          # That had never been observed because no run has ever REACHED this
          # step -- every one of them died at `verifier-negative` first. The
          # next run is the first that gets here, and it would have been the
          # first lifecycle result in the project's history arriving with its
          # diagnosis stripped off.
          #
          # Found by auditing every `shell: pwsh` step in this file for the
          # mechanism after Windows #17, rather than by waiting to be bitten
          # by it a second time. Reproduced on pwsh 7.4.6 with the runner's
          # setting forced on; see PL-0733's gate evidence.
          $PSNativeCommandUseErrorActionPreference = $false

          $inventory = Get-Content artifact-inventory.json | ConvertFrom-Json
          $msi = $inventory.artifacts | Where-Object { $_.kind -eq "msi" }
          if (-not $msi) { throw "no msi in the inventory" }
          $installer = Join-Path "apps/desktop/src-tauri/target/release/bundle" $msi.name

          # PRINTED BEFORE THE RUN so an F1 of `not-run` is readable as a fact
          # about this machine rather than as a mystery.
          $root = Join-Path ${env:ProgramFiles} "Project Liberty"
          Write-Host "install root before the harness: $root (exists: $(Test-Path $root))"
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 40 | ForEach-Object { Write-Host "  leftover: $($_.FullName)" }
          }

          & node scripts/windows/lifecycle.mjs --msi "$installer" --out windows-lifecycle-report.json
          $code = $LASTEXITCODE

          # THE THREE EXIT CODES MEAN DIFFERENT THINGS and the first run is
          # exactly when that matters: 2 is a REFUSAL (bad arguments, wrong
          # platform) and reads as a wiring mistake here, 1 is a real case
          # failure and reads as a product or classifier finding, 0 is every
          # automated case passing. Collapsing them is how a configuration
          # mistake gets filed as a product defect.
          switch ($code) {
            0 { Write-Host "lifecycle: every automated case passed" }
            1 { Write-Host "lifecycle: at least one automated case FAILED -- read the report below" }
            2 { Write-Host "lifecycle: REFUSED to run (arguments or platform). This is a wiring fault in this workflow, not a product failure." }
            default { Write-Host "lifecycle: unexpected exit $code" }
          }
          if ($code -ne 0) { throw "lifecycle.mjs exited $code" }

      # ==================================================================
      # THE REPORT, ON THE RUN PAGE
      # ==================================================================
      #
      # NOT DECORATION. The engineering session that maintains this workflow
      # cannot read run logs or download artifacts -- the Actions API answers
      # 403 and artifact download needs authentication -- but it CAN read a
      # public run page, which is how every CI result in the last three round
      # handoffs was obtained. A job summary renders there. So this step is the
      # difference between "the Windows lifecycle ran" being a fact that can be
      # checked and one that has to be taken on trust, and taking Windows
      # evidence on trust is the one thing this project forbids outright.
      - name: Publish the lifecycle report to the run summary
        id: publish
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "windows-lifecycle-report.json"
          $out = $env:GITHUB_STEP_SUMMARY

          # ================================================================
          # ANNOTATIONS FIRST, AND THE STEP SUMMARY SECOND
          # ================================================================
          #
          # THE ROUND-107 PREMISE FOR THIS STEP WAS WRONG AND IS CORRECTED
          # HERE RATHER THAN QUIETLY. It said a job summary "renders on the
          # run page, which is how every CI result in the last three rounds
          # was obtained", and therefore that writing the lifecycle report to
          # `$GITHUB_STEP_SUMMARY` made it readable by the engineering
          # session. It does not. Run 37094053371 at 975331c executed this
          # workflow and NEITHER the run page nor the job page exposes a word
          # of what was written here; the summary panel a fetch can see
          # carries GitHub's own metadata and artifact list and nothing the
          # workflow wrote.
          #
          # WHAT IS ACTUALLY READABLE IS AN ANNOTATION. Every CI fact this
          # project has ever obtained -- the exit codes, the Playwright
          # counts, and the step name behind exit 134 -- came from one. So
          # the per-case outcome is emitted as `::notice` and `::warning`
          # workflow commands as well, which GitHub attaches to the job and
          # shows without a login.
          #
          # BOTH CHANNELS, NOT ONE. The summary stays because it is far more
          # legible to a HUMAN opening the run in a browser, and it carries
          # the full JSON detail an annotation cannot. The annotations are
          # what make the result verifiable from here. A single line per case
          # is deliberate: annotations are truncated and capped, and a
          # verdict that gets cut in half is worse than a short one.
          function Annotate([string] $level, [string] $title, [string] $message) {
            # One line, no colons-at-start inside the text, and short enough
            # to survive truncation.
            $flat = ($message -replace '\r?\n', ' ') -replace '::', ' - '
            if ($flat.Length -gt 380) { $flat = $flat.Substring(0, 380) + "..." }
            Write-Host "::${level} title=${title}::${flat}"
          }

          function Cell([object] $value) {
            if ($null -eq $value) { return "" }
            return ([string] $value) -replace '\|', '\|' -replace '\r?\n', ' '
          }

          $lines = @("## Windows installer lifecycle (observation only)", "")

          if (-not (Test-Path $path)) {
            # An absent report is itself a result, and it is a DIFFERENT result
            # from a failing one. The harness refuses rather than reports when
            # it cannot run, so saying "no report" beats rendering an empty
            # table that looks like a clean machine.
            # CORRECTED IN ROUND 110. This used to assert that the harness
            # had refused over a bad --msi. It does not know that: the report
            # is equally absent when the Tauri bundle failed, when the
            # inventory held no msi, or when the verifier check failed, and in
            # Windows #14 that wording invited exactly the wrong conclusion.
            # The step that actually failed is named by "Which step failed".
            Annotate "warning" "Windows lifecycle" ("NO REPORT WAS PRODUCED, AND THIS MESSAGE DOES NOT KNOW WHY. " +
              "The report is absent whenever the job did not reach a completed harness run: the bundle may have " +
              "failed, the inventory may have held no msi, the verifier check may have failed, or the harness " +
              "may have refused. Read the 'windows package failed' annotation, which names the failing step.")
            $lines += "**No report was produced, and this section does not know why.**"
            $lines += "The report is absent whenever the job did not reach a completed harness run: the"
            $lines += "bundle may have failed, the inventory may have held no ``msi``, the verifier check"
            $lines += "may have failed, or the harness may have refused. The ``Which step failed`` step"
            $lines += "names the step that actually stopped the job."
            $lines -join "`n" | Out-File -Append -Encoding utf8 $out
            exit 0
          }

          $report = Get-Content $path -Raw | ConvertFrom-Json

          # ConvertFrom-Json turns an ISO-8601 string into a [datetime], and
          # interpolating that renders it in the RUNNER'S locale -- "10/02/2026"
          # with no timezone, which is ambiguous between two continents and
          # loses the only unambiguous form the harness wrote. Put it back.
          $producedAt = if ($report.producedAt -is [datetime]) {
            $report.producedAt.ToUniversalTime().ToString("o")
          } else { [string] $report.producedAt }
          $lines += "Produced by ``$($report.producedBy)`` on ``$($report.platform)`` at $producedAt."
          $lines += ""
          $lines += "> **These rows gate the build** (round 109). A ``fail`` here fails the job. ``not-run``"
          $lines += "> does not: it is the harness refusing to report a scenario it could not perform, and"
          $lines += "> every one of them names its reason."
          $lines += ""
          $lines += "| Case | Scenario | Owner | Outcome |"
          $lines += "| --- | --- | --- | --- |"
          foreach ($r in $report.results) {
            $lines += "| $(Cell $r.id) | $(Cell $r.scenario) | $(Cell $r.owner) | **$(Cell $r.outcome)** |"
            # A FAILURE IS A WARNING AND EVERYTHING ELSE IS A NOTICE. `not-run`
            # is deliberately NOT a warning: F2 reports it because this
            # repository has never shipped a previous release, which is a fact
            # about the project and not a defect to be alarmed by.
            $level = if ($r.outcome -eq "fail") { "warning" } else { "notice" }
            $detail = if ($r.detail -is [string]) { $r.detail } else { ($r.detail | ConvertTo-Json -Depth 4 -Compress) }
            Annotate $level "Windows lifecycle $($r.id) - $($r.outcome)" "$($r.scenario) [owner $($r.owner)] $detail"
          }
          # One line that says what the run as a whole did, so a reader who
          # sees no per-case annotation knows whether that is good news.
          $counts = @{}
          foreach ($r in $report.results) { $counts[$r.outcome] = 1 + ($counts[$r.outcome] ?? 0) }
          $tally = (($counts.Keys | Sort-Object) | ForEach-Object { "$_=$($counts[$_])" }) -join " "
          Annotate "notice" "Windows lifecycle summary" ("Automated section-F cases on this runner: $tally. " +
            "These rows GATE the build: a fail fails the job. A not-run does not, and names its reason. " +
            "No claim is made about the application LAUNCHING -- a runner has no attended session.")

          $lines += ""
          $lines += "### Still owed by a real machine"
          $outstanding = @($report.outstandingForTheCommandersMachine)
          if ($outstanding.Count -eq 0) {
            $lines += "_Nothing recorded._"
          } else {
            foreach ($o in $outstanding) {
              $why = if ($o.outstanding) { $o.outstanding } else { $o.blockedReason }
              $lines += "- **$(Cell $o.id)** ($(Cell $o.owner)) — $(Cell $o.scenario): $(Cell $why)"
            }
          }

          $lines += ""
          $lines += "### What this report does not claim"
          $lines += (Cell $report.claim)

          foreach ($r in $report.results) {
            $lines += ""
            $lines += "<details><summary>$(Cell $r.id) detail — $(Cell $r.outcome)</summary>"
            $lines += ""
            $lines += '```json'
            $lines += ($r.detail | ConvertTo-Json -Depth 8)
            $lines += '```'
            $lines += ""
            $lines += "</details>"
          }

          # A job summary is capped at 1 MiB and a silently truncated one would
          # be worse than a short one, so the cut is made here and announced.
          $text = $lines -join "`n"
          $limit = 900000
          if ($text.Length -gt $limit) {
            $text = $text.Substring(0, $limit) + "`n`n_**Truncated** at $limit characters. The complete report is in the ``liberty-windows-installer-logs`` artifact._"
          }
          $text | Out-File -Append -Encoding utf8 $out

      - name: Upload the unsigned installers and their inventory
        id: uploadinstallers
        uses: actions/upload-artifact@v4
        with:
          # UNSIGNED IS IN THE NAME, so a consumer cannot mistake this for a
          # release artifact by reading a download link.
          name: liberty-windows-unsigned-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifact-inventory.json
          if-no-files-found: error
          retention-days: 14

      # Uploaded whatever happened, because an MSI log is only interesting when
      # the step above failed -- and `if: always()` on an upload is not
      # `continue-on-error`: the job's result is unchanged.
      - name: Upload the installer logs
        id: uploadlogs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: liberty-windows-installer-logs-${{ github.sha }}
          path: |
            install.log
            uninstall.log
            lifecycle-install.log
            lifecycle-upgrade.log
            lifecycle-uninstall.log
            lifecycle-reinstall.log
            windows-lifecycle-report.json
          if-no-files-found: ignore
          retention-days: 14

      # ==================================================================
      # WHICH STEP ACTUALLY FAILED (PW-0602, round 110)
      # ==================================================================
      #
      # A CORRECTION RATHER THAN AN ADDITION. Windows #14 failed this job with
      # "Process completed with exit code 1" and nothing else, because only two
      # of its fourteen steps carried an `id`. The only other annotation was
      # the lifecycle publisher's "NO REPORT WAS PRODUCED", which then invited
      # the reader to conclude the harness had refused over a bad --msi -- a
      # cause it had not measured and could not know, since the report is
      # equally absent when the Tauri bundle fails, when the inventory holds no
      # msi, or when the verifier check fails.
      #
      # So this names the step. Same mechanism `ci.yml` already uses for its
      # validate job and for the same reason: the agent session that maintains
      # this workflow cannot read run logs or download artifacts -- the Actions
      # API answers 403 and artifact download needs authentication -- and
      # annotations are the one channel it CAN read.
      #
      # `failure()` rather than `always()`: on a green run there is no first
      # failing step, and an annotation saying so would be noise on every
      # successful build.
      - name: Which step failed
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Annotate([string] $level, [string] $title, [string] $message) {
            $flat = ($message -replace '\r?\n', ' ') -replace '::', ' - '
            if ($flat.Length -gt 380) { $flat = $flat.Substring(0, 380) + "..." }
            Write-Host "::${level} title=${title}::${flat}"
          }

          # IN EXECUTION ORDER, so "the first one that is not success" really
          # is the step that stopped the job. A hashtable would not preserve
          # that and the answer would depend on enumeration order.
          $steps = @(
            @{ name = "checkout";           outcome = "${{ steps.checkout.outcome }}" }
            @{ name = "setup-node";         outcome = "${{ steps.node.outcome }}" }
            @{ name = "rust-toolchain";     outcome = "${{ steps.rust.outcome }}" }
            @{ name = "rust-cache";         outcome = "${{ steps.rustcache.outcome }}" }
            @{ name = "npm-ci";             outcome = "${{ steps.install.outcome }}" }
            @{ name = "build-desktop-web";  outcome = "${{ steps.webbuild.outcome }}" }
            @{ name = "package-sidecar";    outcome = "${{ steps.sidecar.outcome }}" }
            @{ name = "tauri-bundle";       outcome = "${{ steps.bundle.outcome }}" }
            @{ name = "artifact-inventory"; outcome = "${{ steps.inventory.outcome }}" }
            @{ name = "verifier-negative";  outcome = "${{ steps.verifier.outcome }}" }
            @{ name = "lifecycle";          outcome = "${{ steps.lifecycle.outcome }}" }
            @{ name = "publish-report";     outcome = "${{ steps.publish.outcome }}" }
            @{ name = "upload-installers";  outcome = "${{ steps.uploadinstallers.outcome }}" }
            @{ name = "upload-logs";        outcome = "${{ steps.uploadlogs.outcome }}" }
          )

          $trail = ($steps | ForEach-Object {
            $o = if ([string]::IsNullOrEmpty($_.outcome)) { "not-reached" } else { $_.outcome }
            "$($_.name)=$o"
          }) -join " "

          $failed = $steps | Where-Object {
            $_.outcome -and $_.outcome -ne "success" -and $_.outcome -ne "skipped"
          } | Select-Object -First 1

          if ($null -eq $failed) {
            Annotate "warning" "windows package failed" "The job failed but no step reports a non-success outcome, so the failure is in the runner or in something this list does not name. Trail: $trail"
          } else {
            Annotate "error" "windows package failed" "FIRST FAILING STEP: $($failed.name) ($($failed.outcome)). Everything after it did not run. Trail: $trail"
          }

          # WHAT THE BUNDLE ACTUALLY PRODUCED. "tauri-bundle=success" and
          # "there is an msi where the inventory looks for one" are different
          # claims, and conflating them is how the previous message went wrong.
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          if (Test-Path $bundleRoot) {
            $found = Get-ChildItem $bundleRoot -Recurse -Include *.msi, *.exe -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
            if ($found) {
              Annotate "notice" "windows package artifacts" ("bundle holds: " + ($found -join "; "))
            } else {
              Annotate "warning" "windows package artifacts" "The bundle directory exists but holds no .msi or .exe at any depth, so nothing downstream had an installer to work with."
            }
          } else {
            Annotate "warning" "windows package artifacts" "No $bundleRoot at all, so the bundle step did not get far enough to create one."
          }

  # =======================================================================
  # THE E2E SUITE AGAINST THE DESKTOP TARGET, ON WINDOWS (PW-0602)
  # =======================================================================
  #
  # PW-0602's first REQUIRED clause, and the sentence that names the defect:
  # "the existing e2e suite runs against the DESKTOP target on Windows, not
  # only the web target on Ubuntu -- the desktop axis is currently built on
  # Ubuntu only, and only incidentally, because the axis defaults on and
  # openssl happens to be installed."
  #
  # A SEPARATE JOB FROM `package`, DELIBERATELY. That job compiles the Tauri
  # graph, downloads WiX, builds an MSI and runs the installer lifecycle
  # against the real Windows installer database; this one starts two Next
  # servers and a loopback stub and drives them with a browser. They share a
  # runner image and nothing else, and folding the second into the first would
  # mean a failing page assertion reads as a packaging failure, with the two
  # competing for one 60-minute ceiling.
  #
  # IT DOES NOT DEPEND ON `package`. The desktop BUILD TARGET is a property of
  # how `apps/web` is built -- `LIBERTY_BUILD_TARGET=desktop`, a separate
  # `distDir`, the forwarder that refuses a non-https backend -- and none of
  # that needs an MSI to exist. Chaining them would make a WiX download failure
  # look like a desktop-target regression and would serialise two jobs that
  # have no reason to wait for each other.
  #
  # ======================================================================
  # WHAT THIS JOB CANNOT DO, STATED RATHER THAN QUIETLY OMITTED
  # ======================================================================
  #
  # It runs the suite in DEVELOPMENT mode only, and that is a real limit with
  # an external cause rather than a convenience. The production run in
  # `ci.yml` gets its identity system from a PostgreSQL SERVICE CONTAINER, and
  # GitHub's service containers run on Linux runners only. So the
  # production-with-a-database rung cannot be reached on `windows-latest`
  # without installing and administering a database on the runner, which is a
  # separate piece of work with its own failure modes.
  #
  # The rung this job DOES reach is the one PW-0602 asked for: the desktop
  # build target, exercised by the same specs, on Windows. The
  # production-with-identity rung stays on Ubuntu and stays claimed by nothing
  # here. A row that is skipped says why, by name -- which is the fourth
  # REQUIRED clause, and `assert-desktop-axis-ran.mjs` below is what stops a
  # skip being mistaken for a pass.
  e2e-desktop:
    runs-on: windows-latest
    # A ceiling for a hang, not a budget. Two Next builds, a browser download
    # and one suite run fit well inside this.
    timeout-minutes: 45

    env:
      # The same @cache-key variables the other jobs pin, for the reason
      # ci.yml's e2e job states at length: `playwright.config.ts` runs the
      # build through turbo inside its `webServer` command, so an unset one
      # hashes as ABSENT and this job could be served an artifact built under
      # a different enforcement mode.
      CONTENT_RIGHTS_ENFORCEMENT: strict
      LIBERTY_FC_SEED: "20250819"
      LIBERTY_FIXTURE_MEDIA_ORIGIN: https://fixtures.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      # `e2e/` is not a workspace member -- playwright.config.ts explains why at
      # length -- so its dependencies install on their own.
      - name: Install the e2e harness
        id: harness
        working-directory: e2e
        run: npm ci --no-audit --no-fund --ignore-scripts

      # ==================================================================
      # OPENSSL IS A PRECONDITION, CHECKED BEFORE THE SUITE RATHER THAN
      # DISCOVERED BY ITS SILENCE
      # ==================================================================
      #
      # `e2e/src/tls.ts` shells out to `openssl` to mint the loopback
      # certificate the stub backend serves, and when it cannot, `env.ts`
      # turns the whole desktop axis off WITH A REASON and the specs skip.
      # That behaviour is correct and must not be relaxed -- the desktop
      # forwarder accepts an https origin only and deliberately does not carve
      # out loopback. What is not acceptable is a green job that skipped.
      #
      # Git for Windows ships openssl at `usr\bin` and that directory is not
      # on PATH in a fresh pwsh session, so this resolves it and adds it when
      # the bare command is missing. If neither is there the job FAILS HERE,
      # naming the cause, rather than fifteen minutes later as an absence.
      - name: Make openssl resolvable, or say why the axis cannot run
        id: openssl
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $found = Get-Command openssl -ErrorAction SilentlyContinue
          if ($null -eq $found) {
            # DEFAULTED RATHER THAN READ BLIND. `$env:ProgramFiles` is
            # always set on Windows, but when it is not, `Join-Path` throws
            # "Cannot bind argument to parameter 'Path' because it is null"
            # -- an opaque failure that replaces the explanatory one below.
            # Found by executing this step with the variable unset.
            $programFiles = if ($env:ProgramFiles) { $env:ProgramFiles } else { "C:\Program Files" }
            # STRING INTERPOLATION RATHER THAN `Join-Path`, which is a
            # provider-aware cmdlet: it resolves the drive and THROWS when
            # there is not one, so a missing `$env:ProgramFiles` or an absent
            # C: produced "Cannot bind argument to parameter 'Path'" or
            # "A drive with the name 'C' does not exist" instead of the
            # explanatory failure below. Both found by executing this step
            # rather than by reading it. `-ErrorAction SilentlyContinue` on
            # the probe for the same reason: a path this job is only
            # guessing at must not raise, it must answer no.
            $gitUsrBin = "$programFiles\Git\usr\bin"
            if (Test-Path -LiteralPath "$gitUsrBin\openssl.exe" -ErrorAction SilentlyContinue) {
              Write-Host "openssl not on PATH; adding $gitUsrBin"
              Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin
              $env:PATH = "$gitUsrBin;$env:PATH"
              $found = Get-Command openssl -ErrorAction SilentlyContinue
            }
          }
          if ($null -eq $found) {
            throw "No openssl on this runner and none at `"$programFiles\Git\usr\bin`". " +
              "e2e/src/tls.ts needs it to mint the loopback certificate the stub backend " +
              "serves, and without it the entire desktop axis skips while this job goes " +
              "green. Install openssl on the runner. Do NOT relax the https-only origin " +
              "check in the desktop forwarder to work around it."
          }
          Write-Host "openssl: $($found.Source)"
          & openssl version

      # ==================================================================
      # THE GUARD'S OWN TESTS, BEFORE THE THING IT GUARDS
      # ==================================================================
      #
      # `assert-desktop-axis-ran.mjs` is the only thing standing between a
      # skipped desktop axis and a green job, so a defect in IT is a silent
      # hole rather than a loud one. Its judgement is ordinary code over an
      # ordinary object and is tested here in a second, before forty minutes
      # of browser work rather than after.
      #
      # NAMED AS A GAP RATHER THAN LEFT: these cases ought to run on EVERY
      # CI run and not only on Windows. `npm run test:scripts` is the alias
      # that would carry them and `package.json` is outside this task's write
      # surface, so this step is where they run today. This repository has
      # found "the thing exists, it passes, and no gate asks it" four times
      # already; running them somewhere beats running them nowhere.
      - name: Test the guard that stops this job passing by skipping
        id: guardtests
        run: node --test e2e/windows/assert-desktop-axis-ran.test.mjs

      - name: Install the browser this job launches
        id: browsers
        working-directory: e2e
        run: npx playwright install chromium

      # ==================================================================
      # THE RUN
      # ==================================================================
      #
      # `--project=api --project=chromium`, the same two ci.yml runs, so this
      # is the SAME SUITE on a different platform and build target rather than
      # a Windows-flavoured subset. The desktop axis is on by default; nothing
      # here switches it on, which is the point -- `LIBERTY_E2E_DESKTOP=off`
      # is the only way to turn it off and this job does not pass it.
      #
      # NO `--retries`. playwright.config.ts sets zero and argues for it; a
      # flake on a new platform is a finding about that platform.
      #
      # `continue-on-error` IS DELIBERATELY ABSENT. PW-0602's first sentence is
      # "fails the build when it fails."
      - name: Run the suite against the desktop target
        id: suite
        working-directory: e2e
        env:
          LIBERTY_E2E_WEB_MODE: development
          # NO DATABASE. Not an omission: GitHub service containers are
          # Linux-only, so the production-with-identity rung is unreachable
          # here and stays on Ubuntu. Development identity comes from headers
          # and needs no store, which is the configuration this job can
          # honestly run.
          # WRITTEN TO THE RUNNER'S TEMP, NOT INTO THE CHECKOUT. A JSON
          # report dropped in `e2e/` is a run artifact inside the working
          # tree: harmless on a throwaway CI checkout, and a stray untracked
          # file on the machine of anybody who reproduces this command
          # locally. `e2e/.gitignore` is outside this task's write surface,
          # and the right answer is not to need it.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/windows-desktop-report.json
        run: npx playwright test --project=api --project=chromium --reporter=list,json

      # ==================================================================
      # AND IT IS NOT ALLOWED TO HAVE PASSED BY SKIPPING
      # ==================================================================
      #
      # The step above exits 0 when every desktop case SKIPPED, which is
      # precisely what happens when the certificate could not be minted. This
      # repository has been bitten twice by a gate that never fired; the check
      # is a script rather than a shell condition so its judgement is unit
      # tested in `assert-desktop-axis-ran.test.mjs` on a machine that cannot
      # run the suite it judges.
      #
      # `!cancelled()` rather than only on success: a run that FAILED still
      # answers the question "did the axis execute", and a job that is red for
      # two reasons should say both.
      - name: The desktop axis actually ran
        id: axis
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        working-directory: e2e
        run: node windows/assert-desktop-axis-ran.mjs "${{ runner.temp }}/windows-desktop-report.json"

      # ==================================================================
      # WHAT HAPPENED, IN THE ONE CHANNEL THIS SESSION CAN READ
      # ==================================================================
      #
      # Round 108 established that `$GITHUB_STEP_SUMMARY` is not readable from
      # the agent session that has to consume these results, and that
      # annotations are. The Windows run proved the annotation channel works.
      - name: Publish what the run reported
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Annotate([string] $level, [string] $title, [string] $message) {
            $flat = ($message -replace '\r?\n', ' ') -replace '::', ' - '
            if ($flat.Length -gt 380) { $flat = $flat.Substring(0, 380) + "..." }
            Write-Host "::${level} title=${title}::${flat}"
          }

          $reportPath = Join-Path "${{ runner.temp }}" "windows-desktop-report.json"
          if (-not (Test-Path $reportPath)) {
            Annotate "warning" "windows desktop e2e" "No JSON report was written, so the suite did not get far enough to produce one. Read the 'Run the suite against the desktop target' step."
            exit 0
          }

          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $stats = $report.stats
          # Rounded: Playwright reports the duration as a float and an
          # annotation reading "14398.756000000001ms" is noise where a
          # whole number of seconds is the fact anybody wants.
          Annotate "notice" "windows desktop e2e" ("expected={0} unexpected={1} flaky={2} skipped={3} duration={4}s" -f $stats.expected, $stats.unexpected, $stats.flaky, $stats.skipped, [math]::Round($stats.duration / 1000, 1))
          Annotate "notice" "windows desktop axis" ("openssl={0}; mode=development; database=none (GitHub service containers are Linux-only, so the production-with-identity rung stays on Ubuntu)" -f (Get-Command openssl -ErrorAction SilentlyContinue).Source)

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows-desktop
          path: |
            e2e/playwright-report
            ${{ runner.temp }}/windows-desktop-report.json
          retention-days: 14
          if-no-files-found: warn
