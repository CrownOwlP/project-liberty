name: Agent - Claude Worker

# Autonomous Claude implementation worker.
#
# ============================================================================
# WHY THIS IS FOUR JOBS AND NOT ONE
# ============================================================================
#
# The previous version did everything on one runner: deterministic control-plane
# steps, the model, the gates, and the credentialed push. It carried careful
# in-job guards -- a trusted runtime copied outside the workspace, a pre-gate
# allowed-path check, step-scoped secrets. Every one of those guards was real,
# and together they were still not a boundary, because a GitHub job is not one.
#
# Two mechanisms defeat any in-job scheme:
#
#   1. A step can write $GITHUB_ENV, and those variables apply to LATER steps in
#      the same job. Model-authored test code executing during the gate step --
#      entirely within its allowed paths, so nothing rejects it -- could rewrite
#      $TRUSTED and aim the credentialed finalizer at scripts of its choosing.
#      A pre-gate check cannot prevent this: it runs before the code does.
#
#   2. node_modules is gitignored, so a `git status`-based scope check cannot
#      see edits to it, while `npm run test` resolves the whole toolchain from
#      it. A modified dependency could fabricate green gates leaving no
#      git-visible trace.
#
# Neither is fixable by adding another in-job guard. So the trust levels are
# separated into jobs, which are separate runners with separate filesystems and
# separate environment:
#
#   prepare  deterministic control plane. Write token. No model, no model code.
#   model    the model. contents: read, no write token. Emits a PATCH.
#   gate     executes model-authored code. NO secrets, NO write token, fresh
#            checkout, dependencies installed after the model is gone.
#   publish  applies the verified patch and pushes. Write token. Executes no
#            model-authored code at all.
#
# The only thing crossing between them is a patch file. A patch is inert -- it
# writes files, it does not run. Each receiving job re-verifies it against its
# own checkout's control plane, so no job has to trust that an earlier one
# behaved.
#
# The property this buys: a job holding a credential never executes code the
# model wrote, in any step, at any point.

on:
  workflow_dispatch:
    inputs:
      depth:
        description: Chain depth; the loop halts at max-depth to prevent storms.
        required: false
        default: "0"
      reason:
        description: Why this run was triggered.
        required: false
        default: manual
  schedule:
    - cron: "15,45 * * * *"

concurrency:
  group: project-liberty-agent-bus
  cancel-in-progress: false

# Deliberately empty at workflow level. Permissions are granted per job, and
# only the two jobs that genuinely write get contents: write. An action can read
# github.token from its security context even when the workflow does not pass it
# explicitly, so the model job's permissions must be narrow at the JOB level --
# persist-credentials: false alone does not remove a write-capable token from
# the job's context.
permissions: {}

env:
  LIBERTY_JOURNAL_DIR: coordination/agent-bus/cloud-journal

jobs:
  # ==========================================================================
  # 1. PREPARE -- deterministic control plane. No model, no model-authored code.
  # ==========================================================================
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      has_approved: ${{ steps.approved.outputs.has_approved }}
      next_depth: ${{ steps.depth.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Halt runaway chains
        id: depth
        run: |
          DEPTH="${{ github.event.inputs.depth || '0' }}"
          if [ "$DEPTH" -ge 12 ]; then
            echo "::error::chain depth $DEPTH reached the limit; halting to prevent a workflow storm"
            exit 1
          fi
          echo "next=$((DEPTH + 1))" >> "$GITHUB_OUTPUT"

      # ORDERING IS LOAD-BEARING. The gate used to be computed BEFORE the inbox
      # was processed: an approval was applied locally, the already-computed gate
      # still read complete=false, completion was skipped, and the applied review
      # was never pushed -- so the next runner started from the same remote state
      # and repeated forever. Every mutation is published BEFORE the next
      # decision is made from it.

      - name: Validate the control plane (fail closed)
        run: node scripts/ai-control-plane.mjs validate

      - name: Recover and process the Claude inbox
        # Tolerant by design: one permanently-rejected message is quarantined and
        # processing continues. That is a per-message fault, not a halt.
        continue-on-error: true
        run: node scripts/agent-bus.mjs process claude-lead

      - name: Publish inbox results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloud/publish-control-state.mjs --agent claude-lead --reason "inbox processed"

      - name: List tasks awaiting completion
        id: approved
        # Completion RE-EXECUTES every required gate, which for a product task
        # means npm run lint/test/build over model-authored code. Doing that
        # here would execute model code in a job holding a write token -- the
        # same rule the split exists to enforce, broken on the completion path.
        # So this job only names them; the split below runs and records them.
        run: node scripts/cloud/advance-completable.mjs --list-approved

  # ==========================================================================
  # 2. COMPLETION GATES -- re-runs approved tasks' gates. No credential.
  # ==========================================================================
  completion_gates:
    needs: inbox
    if: needs.inbox.outputs.has_approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Installed HERE, in the job that runs the gates. The previous structure
      # called advance-completable from a job that installed nothing at all, so
      # the first approved product task would have failed its lint/typecheck/
      # unit/build gates for want of node_modules rather than on its merits.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Execute the gates of approved tasks
        run: node scripts/cloud/advance-completable.mjs --execute-only

  # ==========================================================================
  # 3. DISPATCH -- records completions and selects the next task. Credentialed.
  # ==========================================================================
  dispatch:
    needs: [inbox, completion_gates]
    # `always()` plus an explicit result check: `completion_gates` is SKIPPED
    # when nothing is awaiting completion, and a skipped dependency would
    # otherwise cancel this job and stall the whole loop.
    if: always() && needs.inbox.result == 'success' && needs.completion_gates.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      task: ${{ steps.select.outputs.task }}
      orchestrate: ${{ steps.gate.outputs.orchestrate }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No npm install. Every script below uses Node builtins only, so this
      # credentialed job has no dependency tree and executes nothing the model
      # wrote -- including no install lifecycle scripts.

      - name: Record completions and move approved tasks to DONE
        # Records without running. Sound only because this step is reached only
        # when GitHub concluded the no-credential gate job succeeded -- a fact
        # model code cannot write.
        if: needs.completion_gates.result == 'success'
        run: |
          node scripts/cloud/advance-completable.mjs \
            --record-only \
            --evidence "executed in isolated completion gate job, conclusion success: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish completion results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloud/publish-control-state.mjs --agent claude-lead --reason "completed approved tasks"

      - name: Check orchestrator activation gate
        id: gate
        run: node scripts/cloud/orchestrator-gate.mjs

      - name: Select, claim and start exactly one task
        id: select
        # Control-plane MUTATIONS happen here, never in the model.
        if: steps.gate.outputs.orchestrate == 'true'
        run: node scripts/cloud/select-task.mjs --agent claude-lead

      - name: Publish the claim
        # The claim must be durable before the model job starts. Otherwise a
        # crash in a later job leaves a task nobody owns and nobody released.
        if: steps.select.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/cloud/publish-control-state.mjs \
            --agent claude-lead \
            --task ${{ steps.select.outputs.task }} \
            --reason "claimed and started"

      - name: Record the base commit
        id: base
        # Every later job checks out exactly this commit. Using a branch name
        # would let the tree move underneath the split.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the task briefing
        # Generated deterministically and carried to the model job as an
        # artifact. The model reads it with Read; it needs no command execution
        # to learn what it is doing.
        if: steps.select.outputs.selected == 'true'
        run: |
          node scripts/ai-control-plane.mjs review-status ${{ steps.select.outputs.task }} \
            > task-briefing.md

      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.selected == 'true'
        with:
          name: task-briefing
          path: task-briefing.md
          retention-days: 1

  # ==========================================================================
  # 4. MODEL -- the only job the model runs in. No write token. Emits a patch.
  # ==========================================================================
  model:
    needs: dispatch
    if: needs.dispatch.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # READ. The model job must not hold a write-capable token at all, not
      # merely avoid using one: an action can reach github.token through its
      # security context regardless of what the workflow passes it.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dispatch.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No `npm ci`. The model has no command execution, so it needs no
      # dependencies -- and not installing them means there is no toolchain here
      # for it to tamper with. The gate job installs its own, after the model is
      # gone.

      - uses: actions/download-artifact@v4
        with:
          name: task-briefing

      - name: Snapshot protected control/bus state
        run: node scripts/cloud/protect-state.mjs --snapshot

      - name: Strip executable project configuration
        # Removing Bash does NOT end command execution. `.claude/settings.json`
        # registers a PostToolUse hook -- a shell command fired by Write/Edit,
        # outside the Bash permission system -- and this repository's hook runs
        # `node ${CLAUDE_PROJECT_DIR}/scripts/validate-repo.mjs`. The model could
        # write that file and have the very Write that created it run the code.
        #
        # The configuration is physically removed, and the flags below stop a
        # re-created one from becoming an active source mid-session. Neither
        # control is sufficient alone.
        id: harden
        run: |
          node scripts/cloud/harden-model-session.mjs --preflight
          node scripts/cloud/harden-model-session.mjs --strip
          node scripts/cloud/harden-model-session.mjs --assert

      - name: Implement the selected task
        uses: anthropics/claude-code-action@v1
        env:
          GIT_TERMINAL_PROMPT: "0"
          # Relocates the USER settings source to a freshly created empty
          # directory, so `--setting-sources user` selects a provably empty
          # source rather than whatever the runner image happens to carry.
          CLAUDE_CONFIG_DIR: ${{ steps.harden.outputs.config_dir }}
          # Auto memory is documented as not governed by setting sources.
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Each flag does a different job:
          #   --tools            restricts which built-in tools EXIST. Documented
          #                      as the availability control; --allowedTools is
          #                      permission configuration and does not remove a
          #                      tool from the session.
          #   --allowedTools     stops those same tools prompting, since no human
          #                      is present to answer.
          #   --setting-sources  selects which settings sources load at all.
          #   --strict-mcp-config  ignores every MCP configuration but an explicit
          #                      one; none is passed, so no MCP tools exist.
          #
          # Bash is absent -- but note that its absence was never what prevented
          # command execution. Hooks sit outside the tool permission system
          # entirely, which is why the strip step and the setting-source
          # isolation are the controls that actually close that path.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Edit,Write,Glob,Grep"
            --allowedTools "Read,Edit,Write,Glob,Grep"
          prompt: |
            You are the autonomous claude-lead worker for Project Liberty,
            running unattended in CI. Read CLAUDE.md first.

            A task has ALREADY been claimed and started for you: ${{ needs.dispatch.outputs.task }}.
            You do not choose it and you cannot change task state.

            Do exactly this, then stop:

            1. Read `task-briefing.md` in the repository root. It holds this
               task's acceptance criteria, allowedPaths and review findings.
            2. If the review record shows CHANGES_REQUESTED, address every
               blocking finding. That is the whole job for this run.
            3. Otherwise implement the acceptance criteria.
            4. Edit ONLY within the task's allowedPaths. Edits outside them are
               discarded by a later job, so they are wasted work, not a shortcut.
            5. STOP. Leave your edits in the working tree.

            You have NO command execution. That is deliberate, not an outage:
            every runnable command was reachable through files you can write, so
            an allowlist was not a boundary. Do not look for a way around it.

            Practically: you cannot run the tests, so write code you can defend
            by reading it. Prefer changes whose correctness is evident from the
            source. Where you are genuinely unsure something passes, say so in
            your final message rather than assuming.

            Separate jobs after this one execute the gates on a clean runner,
            review the change, and push it. You cannot claim, start, gate,
            transition, approve, publish, commit or push, and this job holds no
            repository write credential to find. Independent review is mandatory
            and you may never approve your own work.

            Constraints you must not violate:
            - Only licensed, user-owned or public-domain content may enter playback resolution.
            - Never add logic that bypasses DRM, paywalls, auth, geo-restrictions or rights.
            - Never invent provider credentials or claim external access you do not have.
            - If every remaining task is blocked on a human or provider dependency,
              say so and stop cleanly rather than inventing work.

      - name: Restore protected control/bus state
        # Discards any model edit to control/bus state and to executable
        # configuration, before the patch is taken.
        if: always()
        run: node scripts/cloud/protect-state.mjs --restore

      - name: Export the in-scope patch
        # The ONLY output of this job. Verified here, and verified again by every
        # job that receives it, from that job's own control plane.
        id: patch
        run: |
          rm -f task-briefing.md
          node scripts/cloud/task-patch.mjs \
            --export \
            --task ${{ needs.dispatch.outputs.task }} \
            --agent claude-lead \
            --out task.patch

      - uses: actions/upload-artifact@v4
        with:
          name: task-patch
          path: task.patch
          retention-days: 1

  # ==========================================================================
  # 5. GATE -- executes model-authored code. Nothing here is worth stealing.
  # ==========================================================================
  gate:
    needs: [dispatch, model]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # READ, and no secrets are referenced anywhere in this job. This is an
      # honest untrusted-code execution zone: `npm run test` and `npm run build`
      # import model-authored code, and imported code can call any Node API.
      # "The model cannot cause code execution anywhere in the workflow" is not
      # a property this design has, or can have, while it tests what the model
      # wrote. What makes it acceptable is that this runner holds no credential,
      # no write token, and is destroyed afterwards.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # FRESH checkout of the base commit. The model's runner is gone; its
          # filesystem, its node_modules and its environment do not exist here.
          ref: ${{ needs.dispatch.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: task-patch

      - name: Verify and apply the patch
        # Scope is re-derived from THIS checkout's control/tasks.json. The model
        # job's assertion that it stayed in scope is not evidence.
        run: |
          node scripts/cloud/task-patch.mjs --verify --task ${{ needs.dispatch.outputs.task }} --in task.patch
          node scripts/cloud/task-patch.mjs --apply  --task ${{ needs.dispatch.outputs.task }} --in task.patch

      - name: Install dependencies AFTER the model is gone
        # --ignore-scripts: install lifecycle scripts are arbitrary code from the
        # dependency tree, and running them is not needed to place files on disk.
        # Installing here rather than in the model job means the toolchain the
        # gates resolve was never reachable by the model -- closing the
        # node_modules hole that a git-based scope check structurally cannot see,
        # because node_modules is gitignored.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Execute the required gates
        # Executes and exits non-zero on failure. Records NOTHING: this job has
        # no write token, and a results file written by a runner where untrusted
        # code executed would not be evidence anyway. The signal that travels
        # onward is this JOB'S CONCLUSION, which GitHub determines from step exit
        # codes and model code cannot forge.
        run: node scripts/cloud/run-gates.mjs --task ${{ needs.dispatch.outputs.task }} --execute-only

  # ==========================================================================
  # 6. PUBLISH -- holds the write token. Executes no model-authored code.
  # ==========================================================================
  publish:
    needs: [inbox, dispatch, model, gate]
    if: always() && needs.dispatch.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dispatch.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No `npm ci` and no `npm` anything. Every script this job runs uses only
      # Node builtins, so there is no dependency tree here and no install
      # lifecycle to execute. The job applies a patch and runs git; it never
      # executes what the model wrote.

      - name: Publish the failure and stop
        # The gate job failing is not an error to swallow: the transition exists
        # only in ephemeral runners, and without pushing it, remote main never
        # learns the task failed and the scheduler reselects it forever.
        if: needs.gate.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ai-control-plane.mjs block ${{ needs.dispatch.outputs.task }} \
            "gates failed or were skipped in the isolated gate job (run ${{ github.run_id }})"
          node scripts/cloud/publish-control-state.mjs \
            --agent claude-lead \
            --task ${{ needs.dispatch.outputs.task }} \
            --reason "gate job ${{ needs.gate.result }}; implementation not committed"
          echo "::error::Gate job ${{ needs.gate.result }} for ${{ needs.dispatch.outputs.task }}. Failure published; no review requested."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: task-patch

      - name: Verify and apply the patch
        # Third independent verification, from this job's own control plane.
        run: |
          node scripts/cloud/task-patch.mjs --verify --task ${{ needs.dispatch.outputs.task }} --in task.patch
          node scripts/cloud/task-patch.mjs --apply  --task ${{ needs.dispatch.outputs.task }} --in task.patch
          rm -f task.patch

      - name: Record the gate outcomes
        # Records without running. Sound ONLY because this step is reached only
        # when GitHub concluded the gate job succeeded -- a fact model code
        # cannot write. Evidence names that job, so the trail is checkable.
        run: |
          node scripts/cloud/run-gates.mjs \
            --task ${{ needs.dispatch.outputs.task }} \
            --record-only \
            --evidence "executed in isolated gate job, conclusion success: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Finalize the task deterministically
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
        # Stages only this task's allowedPaths, commits the implementation and
        # the review-request state locally, then pushes both in ONE remote
        # transaction. Asserts the workspace holds no credential material and
        # that origin is this workflow's repository before authenticating.
        run: |
          node scripts/cloud/finalize-task.mjs --agent claude-lead --task ${{ needs.dispatch.outputs.task }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh mission control
        if: always()
        run: node scripts/cloud/mission-control-status.mjs --worker claude-lead --phase implement

      - name: Verify the pushed commit in CI
        # A bot push does not trigger CI on its own, so the worker's output would
        # otherwise never be independently verified.
        if: steps.finalize.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Hand control to the GPT reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/ai-control-plane.mjs inbox gpt-architect | grep -q "review_request"; then
            gh workflow run agent-gpt-review.yml \
              --ref main \
              --field depth="${{ needs.inbox.outputs.next_depth }}"
          else
            echo "Nothing awaiting GPT review; chain ends here."
          fi
