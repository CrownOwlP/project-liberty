name: Agent - Claude Worker

# Autonomous Claude implementation worker.
#
# Uses the official anthropics/claude-code-action in automation mode (a `prompt`
# input, so it runs without waiting for an @claude mention).

on:
  workflow_dispatch:
    inputs:
      depth:
        description: Chain depth; the loop halts at max-depth to prevent storms.
        required: false
        default: "0"
      reason:
        description: Why this run was triggered.
        required: false
        default: manual
  schedule:
    - cron: "15,45 * * * *"

concurrency:
  group: project-liberty-agent-bus
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBERTY_JOURNAL_DIR: coordination/agent-bus/cloud-journal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Halt runaway chains
        run: |
          DEPTH="${{ github.event.inputs.depth || '0' }}"
          if [ "$DEPTH" -ge 12 ]; then
            echo "::error::chain depth $DEPTH reached the limit; halting to prevent a workflow storm"
            exit 1
          fi
          echo "NEXT_DEPTH=$((DEPTH + 1))" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check orchestrator activation gate
        id: gate
        # PL-AI-0002 groundwork lands on main before the task is claimable. This
        # keeps autonomous implementation dormant until the control plane allows
        # it, WITHOUT blocking the deterministic steps that let the bootstrap
        # task finish -- gating those would be circular.
        run: node scripts/cloud/orchestrator-gate.mjs

      - name: Validate the control plane (fail closed)
        # NOT continue-on-error. A corrupt or self-inconsistent control plane
        # means the model would be reasoning about state we cannot trust, so the
        # job stops here rather than letting an autonomous agent act on it.
        run: node scripts/ai-control-plane.mjs validate

      - name: Recover and process the Claude inbox
        # Separate step, and tolerant by design: a single permanently-rejected
        # bus message is quarantined and processing continues. That is a
        # per-message fault, not a reason to halt the whole worker.
        continue-on-error: true
        run: node scripts/agent-bus.mjs process claude-lead

      - name: Complete approved tasks deterministically
        # No model involved: records real gate evidence for a task whose
        # independent review already approved it, then moves it to DONE. This is
        # what lets PL-AI-0001 finish and unblock PL-AI-0002 while dormant.
        if: steps.gate.outputs.complete == 'true'
        continue-on-error: true
        run: node scripts/cloud/advance-completable.mjs

      - name: Claim PL-AI-0002 when it becomes available
        if: steps.gate.outputs.orchestrate == 'true' && steps.gate.outputs.needs_claim == 'true'
        run: |
          node scripts/ai-control-plane.mjs claim PL-AI-0002 claude-lead
          node scripts/ai-control-plane.mjs start PL-AI-0002 claude-lead

      - name: Implement the next dispatchable task
        if: steps.gate.outputs.orchestrate == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
          prompt: |
            You are the autonomous claude-lead worker for Project Liberty, running
            unattended in CI. Read CLAUDE.md and coordination/agent-bus/README.md first.

            Do exactly this, then stop:

            1. Run `node scripts/ai-control-plane.mjs status` and
               `node scripts/ai-control-plane.mjs dispatch` to see the real state.
            2. If any task is IN_PROGRESS with CHANGES_REQUESTED on its review record,
               address those blocking findings first. That is the highest priority.
            3. Otherwise pick the single highest-priority task from the
               READY_AND_EXECUTABLE wave. Never touch a READY_BUT_EXTERNAL task.
            4. Claim and start it through the control plane. Never hand-edit
               control/tasks.json.
            5. Implement ONLY within that task's allowedPaths.
            6. Run the required checks and record each gate with real evidence:
               `npm run lint`, `npm run typecheck`, `npm run test`, `npm run build`,
               `node scripts/validate-repo.mjs`, `node scripts/test-ai-control-plane.mjs`.
               NEVER record a gate you did not actually run. If a check fails, fix it
               or block the task with a reason. Do not fabricate evidence.
            7. Commit and push your work to main.
            8. Move the task to REVIEW and publish a review request. `--base auto` is
               MANDATORY: it resolves the previously reviewed commit, or the commit
               implementation started from, so the reviewer receives the full cumulative
               range. There is no parent-commit fallback and the publish will be rejected
               without it.
               `node scripts/agent-bus.mjs handoff --from claude-lead --to gpt-architect
                --type review_request --task <ID> --sha auto --base auto
                --summary "..." --evidence "..."`
               Push again so the request is visible to the GPT lane.
            9. Stop working on that task. Independent review is mandatory and you may
               not approve your own work.

            Constraints you must not violate:
            - Only licensed, user-owned or public-domain content may enter playback resolution.
            - Never add logic that bypasses DRM, paywalls, auth, geo-restrictions or rights.
            - Never invent provider credentials or claim external access you do not have.
            - If every remaining task is blocked on a human or provider dependency, say so
              and stop cleanly rather than inventing work.

      - name: Refresh mission control
        if: always()
        run: node scripts/cloud/mission-control-status.mjs --worker claude-lead --phase implement

      - name: Publish worker state
        id: publish
        run: |
          git config user.name "liberty-claude-lead[bot]"
          git config user.email "claude-lead@project-liberty.local"

          # Explicit, ownership-aware staging. Never `git add -A`: an
          # unattended worker must not sweep unrelated dirty files into a commit
          # attributed to the task it is working on. Exits non-zero if anything
          # dirty belongs to no active task.
          node scripts/cloud/stage-task-changes.mjs --agent claude-lead

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "claude-lead: autonomous worker state"

          # Never rebase. Review records are bound to commit shas, so rewriting
          # history would invalidate approvals. Require a clean fast-forward and
          # halt on divergence so orchestration resolves it deliberately.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::origin/main has diverged from HEAD. Refusing to rewrite reviewed history; halting for orchestration to resolve."
            exit 1
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the pushed commit in CI
        # A bot push does not trigger CI on its own, so the worker's work would
        # otherwise never be independently verified. Dispatch it explicitly.
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Hand control to the GPT reviewer
        # Only when something is genuinely waiting: an empty dispatch must end
        # the chain rather than ping-pong forever.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/ai-control-plane.mjs inbox gpt-architect | grep -q "review_request"; then
            gh workflow run agent-gpt-review.yml \
              --ref main \
              --field depth="${NEXT_DEPTH}"
          else
            echo "Nothing awaiting GPT review; chain ends here."
          fi
