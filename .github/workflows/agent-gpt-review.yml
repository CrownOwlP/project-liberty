name: Agent - GPT Review

# Autonomous gpt-architect reviewer.
#
# Chaining is EXPLICIT (workflow_dispatch), never implicit. GitHub deliberately
# does not fire workflows for commits pushed with the default GITHUB_TOKEN, so a
# push-triggered loop would silently never chain. Explicit dispatch is both the
# mechanism and the recursion guard.

on:
  workflow_dispatch:
    inputs:
      depth:
        description: Chain depth; the loop halts at max-depth to prevent storms.
        required: false
        default: "0"
  schedule:
    # Safety net: catches anything a dispatch missed. Cheap because the worker
    # exits immediately when the inbox is empty.
    - cron: "*/30 * * * *"

# One bus job at a time, repo-wide. This serialises claims so two runners can
# never process the same message, and makes the committed journal coherent.
concurrency:
  group: project-liberty-agent-bus
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ephemeral runners have no persistent disk, so recovery state must travel
      # with the repository instead of dying with the container.
      LIBERTY_JOURNAL_DIR: coordination/agent-bus/cloud-journal
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the reviewer diffs an exact commit against its parent.
          fetch-depth: 0
          # checkout persists the job token in .git/config by default. The
          # publisher now asserts the workspace holds no credential material and
          # authenticates per-command instead, so leaving the default on would
          # both weaken the boundary and fail that assertion.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Halt runaway chains
        run: |
          DEPTH="${{ github.event.inputs.depth || '0' }}"
          if [ "$DEPTH" -ge 12 ]; then
            echo "::error::chain depth $DEPTH reached the limit; halting to prevent a workflow storm"
            exit 1
          fi
          echo "DEPTH=$DEPTH" >> "$GITHUB_ENV"
          echo "NEXT_DEPTH=$((DEPTH + 1))" >> "$GITHUB_ENV"

      - name: Verify control plane before acting
        run: node scripts/ai-control-plane.mjs validate

      - name: Check activation gate
        id: gate
        # The review lane stays open even while the orchestrator is dormant:
        # PL-AI-0001 cannot reach DONE without its own independent review, so
        # gating review on PL-AI-0001 being DONE would deadlock the system.
        run: node scripts/cloud/orchestrator-gate.mjs

      - name: Review pending requests
        id: review
        if: steps.gate.outputs.review == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.6' }}
        run: node scripts/cloud/gpt-review-worker.mjs

      - name: Refresh mission control
        if: always()
        run: node scripts/cloud/mission-control-status.mjs --worker gpt-architect --phase review

      - name: Publish bus changes
        id: publish
        # ALWAYS publish. A retryable failure in the review step must not strand
        # decisions and quarantines that were already produced -- otherwise the
        # next run rediscovers the same messages and fails identically.
        if: always() && steps.gate.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # This used to be inline shell that duplicated the Claude lane's publish
        # logic -- stage, commit, fetch, ancestor-check, push -- and the two had
        # already begun to differ. It now calls the same publisher, which also
        # means it inherits the per-command authentication and the assertion that
        # no credential is left persisted in the workspace. `--mode control` is
        # REQUIRED: the reviewer owns no implementation task, so implementation
        # mode would have an empty stageable set and reject every decision,
        # acknowledgement and quarantine it just produced.
        run: |
          node scripts/cloud/publish-control-state.mjs \
            --agent gpt-architect \
            --reason "publish review decisions via agent bus"

      - name: Hand control back to the Claude lane
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run agent-claude-worker.yml \
            --ref main \
            --field depth="${NEXT_DEPTH}" \
            --field reason="gpt review decisions published"
